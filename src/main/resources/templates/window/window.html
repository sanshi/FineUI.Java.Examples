<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 窗体</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:button id="btnShowInServer" css-class="marginr" text="显示窗体（服务端代码）" on-click="btnShowInServer_Click"></f:button>
            <f:button id="btnHideInServer" text="隐藏窗体（服务端代码）" on-click="btnHideInServer_Click"></f:button>
            <br />
            <br />
            <f:button id="btnShowInClient" css-class="marginr" text="显示窗体（客户端代码）" click-handler="onOpenWindow1Click"></f:button>
            <f:button id="btnHideInClient" css-class="marginr" text="隐藏窗体（客户端代码）" click-handler="onCloseWindow1Click"></f:button>
            <f:button id="btnHideInClient2" text="隐藏窗体，带回发参数（客户端代码）" click-handler="onCloseWindow1PostBackClick"></f:button>
            <br />
            <br />

            <f:window id="Window1" width="650" height="300" icon="TagBlue" title="窗体" enable-maximize="true" enable-collapse="true" enable-resize="true"
                is-modal="false" close-action="HidePostBack" on-close="Window1_Close" auto-scroll="true" body-padding="10"
                content="<p><a href='http://tech.163.com/special/jobsdead/' target='_blank'><b>乔布斯</b></a></p><p>乔布斯于1955年2月24日出生，苹果创始人之一。今年8月苹果超越埃克森美孚成为全球最大市值企业，截止上季度持有现金达到762亿美金，甚至超过了美国政府国库存款。</p><p>遗憾的是，苹果的取得巨大成功还是无法给乔布斯一个健康的身体，乔布斯2003年被发现患有胰脏癌，随后又查出肝癌，危在旦夕的乔布斯在经历了8年的抗癌斗争、3次病休、若干次手术后，于2011年8月25日正式宣布从CEO位置辞职。2011年10月6日，乔布斯在苹果发布iPhone 4S后的第二天与世长辞。</p>">
                <f:listeners>
                    <f:listener event="resize" handler="onWindowResize" />
                </f:listeners>
            </f:window>
            <br>
            <br>
            注：
            <ul>
                <li>close-action 的默认值为 Hide，关闭窗体时不会触发 on-close 事件；</li>
                <li>本示例设置了 close-action="HidePostBack"，点击窗体关闭按钮或者按下 ESC 键时，会触发 on-close 事件。</li>
            </ul>

        </th:block>
        <th:block layout:fragment="script">
            <script>
                // Window 窗体大小改变的客户端事件
                function onWindowResize(event) {
                    var el = this.el;
                    F.notify("窗体大小改变，宽度：" + el.width() + " 高度：" + el.height());
                }

                function onOpenWindow1Click(event) {
                    F.ui.Window1.show();
                }

                function onCloseWindow1Click(event) {
                    F.ui.Window1.hide();
                }

                function onCloseWindow1PostBackClick(event) {
                    F.ui.Window1.hidePostBack();
                }

            </script>
        </th:block>
    </body>

</html>
