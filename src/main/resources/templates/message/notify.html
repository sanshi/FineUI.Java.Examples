<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 通知对话框</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:form id="SimpleForm1" is-fluid="true" title="创建通知对话框" label-width="200" body-padding="10">
                <f:items>
                    <f:group-panel id="GroupPanel2" layout="Anchor" title="常用属性">
                        <f:items>
                            <f:text-box id="tbxMessage" required="true" show-red-star="true" label="消息提示" text="数据保存成功！"></f:text-box>
                            <f:number-box id="nbDisplayMilliseconds" label="显示的毫秒数（0不消失）" required="true" show-red-star="true" no-decimal="true"
                                no-negative="true" max-value="60000" text="5000"></f:number-box>
                            <f:check-box id="cbxDisplayProgress" checked="true" label="是否显示倒计时进度条"></f:check-box>
                            <f:check-box id="cbxShowLoading" checked="false" label="是否显示正在加载图片"></f:check-box>
                            <f:check-box id="cbxIsModal" checked="false" label="是否模式对话框"></f:check-box>
                        </f:items>
                    </f:group-panel>
                    <f:group-panel id="GroupPanel4" layout="Anchor" title="位置与排列">
                        <f:items>
                            <f:text-box id="tbxBodyPadding" label="正文区域内边距" text="10px"></f:text-box>
                            <f:drop-down-list id="ddlPositionX" label="横向显示位置">
                                <f:items>
                                    <f:list-item value="Left" text="左侧"></f:list-item>
                                    <f:list-item value="Center" text="中间"></f:list-item>
                                    <f:list-item value="Right" text="右侧" selected="true"></f:list-item>
                                </f:items>
                            </f:drop-down-list>
                            <f:drop-down-list id="ddlPositionY" label="纵向显示位置">
                                <f:items>
                                    <f:list-item value="Top" text="顶部"></f:list-item>
                                    <f:list-item value="Center" text="中间"></f:list-item>
                                    <f:list-item value="Bottom" text="底部" selected="true"></f:list-item>
                                </f:items>
                            </f:drop-down-list>
                            <f:drop-down-list id="ddlMessageAlign" label="正文排列位置">
                                <f:items>
                                    <f:list-item value="Left" text="靠左" selected="true"></f:list-item>
                                    <f:list-item value="Center" text="居中"></f:list-item>
                                    <f:list-item value="Right" text="靠右"></f:list-item>
                                </f:items>
                            </f:drop-down-list>
                        </f:items>
                    </f:group-panel>
                    <f:group-panel id="GroupPanel1" layout="Anchor" title="标题栏设置">
                        <f:items>
                            <f:check-box id="cbxShowHeader" checked="true" label="是否显示标题栏">
                                <f:listeners>
                                    <f:listener event="change" handler="onShowHeaderChange"></f:listener>
                                </f:listeners>
                            </f:check-box>
                            <f:text-box id="tbxTitle" label="对话框标题"></f:text-box>
                            <f:check-box id="cbxEnableDrag" checked="true" label="是否可移动"></f:check-box>
                            <f:check-box id="cbxEnableClose" checked="true" label="是否可关闭"></f:check-box>
                        </f:items>
                    </f:group-panel>
                    <f:group-panel id="GroupPanel3" layout="Anchor" title="其它属性">
                        <f:items>
                            <f:text-box id="tbxID" label="对话框ID"></f:text-box>
                            <f:number-box id="nbWidth" no-decimal="true" no-negative="true" label="对话框宽度" min-value="200" max-value="900"></f:number-box>
                            <f:number-box id="nbMinWidth" no-decimal="true" no-negative="true" label="对话框最小宽度"></f:number-box>
                            <f:number-box id="nbMaxWidth" no-decimal="true" no-negative="true" label="对话框最大宽度"></f:number-box>
                            <f:drop-down-list id="ddlMessageBoxIcon" label="消息图标">
                                <f:items>
                                    <f:list-item value="None" text="无图标" selected="true"></f:list-item>
                                    <f:list-item value="Information" text="消息"></f:list-item>
                                    <f:list-item value="Warning" text="警告"></f:list-item>
                                    <f:list-item value="Question" text="问题"></f:list-item>
                                    <f:list-item value="Error" text="错误"></f:list-item>
                                    <f:list-item value="Success" text="成功"></f:list-item>
                                </f:items>
                            </f:drop-down-list>
                            <f:drop-down-list id="ddlTarget" label="弹出位置">
                                <f:items>
                                    <f:list-item value="Self" text="当前页面" selected="true"></f:list-item>
                                    <f:list-item value="Parent" text="父页面"></f:list-item>
                                    <f:list-item value="Top" text="顶层页面"></f:list-item>
                                </f:items>
                            </f:drop-down-list>
                        </f:items>
                    </f:group-panel>
                </f:items>
                <f:toolbars>
                    <f:toolbar position="Bottom" toolbar-align="Right">
                        <f:items>
                            <f:button id="btnHello" text="点击弹出通知对话框" validate-forms="SimpleForm1" on-click="btnSubmit_Click"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:form>

        </th:block>

        <th:block layout:fragment="script">
            <script>
                function onShowHeaderChange(event) {
                    var checked = this.getValue();

                    F.ui.tbxTitle.setHidden(!checked);
                    F.ui.cbxEnableDrag.setHidden(!checked);
                    F.ui.cbxEnableClose.setHidden(!checked);
                }

                function notifyHideCallback() {
                    F.notify('通知框消失了！');
                }

            </script>
        </th:block>
    </body>

</html>
