<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 响应确定按钮（点击确定按钮后，先隐藏 IFrame 窗体再下载文件）</title>
        <!--/* 声明本页引用的其它源文件（分号分隔，每项写成 前缀:值，前缀有 route/template/class/res 四种，见 SourceFiles）：首页"查看源代码"把它们也渲染为选项卡 */-->
        <meta name="sourcefiles"
            content="route:message/alert-download-hide-iframe/iframe-window;class:com.fineui.java.examples.web.AlertDownloadTextFileController" />
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:window id="Window2" width="650" height="300" icon="TagBlue" title="窗体（EnableIFrame=true）" enable-maximize="true" enable-collapse="false"
                enable-resize="true" body-padding="10" is-modal="false" enable-iframe="true" iframe-url="/message/alert-download-hide-iframe/iframe-window">
            </f:window>

        </th:block>

        <th:block layout:fragment="script">
            <script>
                function showConfirm() {
                    F.confirm({
                        message: '操作成功！点击确定按钮开始下载文件，点取消按钮弹出对话框',
                        ok: function() {
                            window.location.href = F.resolveUrl('/Message/AlertDownloadTextFile');
                        },
                        cancel: function() {
                            // 触发后台事件
                            F.customEvent('ConfirmCancel');
                        }
                    });
                }

            </script>
        </th:block>
    </body>

</html>
