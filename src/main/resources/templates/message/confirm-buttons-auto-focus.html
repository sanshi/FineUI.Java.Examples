<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 设置自动获取焦点的按钮</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:button id="btnOperation1" text="操作一（设置自动获取焦点的按钮）" click-handler="onOperation1Click"></f:button>

        </th:block>

        <th:block layout:fragment="script">
            <script>
                function onOperation1Click(event) {

                    F.create({
                        type: 'MessageBox',
                        message: '您即将直接退出，如果您修改了相关信息，请先保存！',
                        title: '确认退出',
                        buttons: [{
                            buttonId: 'ok',
                            text: '直接退出'
                        }, {
                            buttonId: 'cancel',
                            text: '不退出'
                        }],
                        // 自动获取焦点的按钮 - buttonId
                        autoFocusButtonId: 'cancel',
                        handler: function(event, buttonId) {
                            if (buttonId === 'ok') {
                                F.customEvent('ConfirmOK');
                            } else {
                                F.customEvent('ConfirmCancel');
                            }
                        }
                    });

                }

            </script>
        </th:block>
    </body>

</html>
