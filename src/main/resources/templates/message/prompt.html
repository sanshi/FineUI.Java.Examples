<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 输入对话框</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:form id="SimpleForm1" is-fluid="true" title="创建输入对话框" label-width="150" body-padding="10">
                <f:items>
                    <f:group-panel id="GroupPanel2" layout="Anchor" title="常用属性">
                        <f:items>
                            <f:text-box id="tbxMessage" required="true" show-red-star="true" label="消息提示" text="请输入你的住址？"></f:text-box>
                            <f:text-box id="tbxDefaultValue" label="输入框缺省值" text="这是缺省地址"></f:text-box>
                            <f:text-box id="tbxTitle" label="对话框标题" text="请输入"></f:text-box>
                            <f:check-box id="cbxEnableClose" checked="true" label="是否可关闭"></f:check-box>
                            <f:check-box id="cbxRequired" checked="false" label="是否必填项"></f:check-box>
                            <f:check-box id="cbxIsMultiLine" checked="true" label="是否多行输入框">
                                <f:listeners>
                                    <f:listener event="change" handler="onMultiLineChange"></f:listener>
                                </f:listeners>
                            </f:check-box>
                            <f:number-box id="nbMultiLineHeight" no-decimal="true" no-negative="true" label="多行输入框高度" min-value="80" max-value="300"
                                text="100"></f:number-box>
                            <f:check-box id="cbxIsPassword" checked="false" hidden="true" label="是否密码输入框"></f:check-box>
                            <f:radio-button-list id="rblMessageBoxIcon" label="消息图标" column-number="3">
                                <f:items>
                                    <f:radio-item value="None" text="无图标" selected="true"></f:radio-item>
                                    <f:radio-item value="Information" text="消息"></f:radio-item>
                                    <f:radio-item value="Warning" text="警告"></f:radio-item>
                                    <f:radio-item value="Question" text="问题"></f:radio-item>
                                    <f:radio-item value="Error" text="错误"></f:radio-item>
                                    <f:radio-item value="Success" text="成功"></f:radio-item>
                                </f:items>
                            </f:radio-button-list>
                        </f:items>
                    </f:group-panel>
                    <f:group-panel id="GroupPanel1" layout="Anchor" title="其它属性">
                        <f:items>
                            <f:text-box id="tbxID" label="对话框ID"></f:text-box>
                            <f:number-box id="nbWidth" no-decimal="true" no-negative="true" label="对话框宽度" min-value="200" max-value="900"></f:number-box>
                            <f:number-box id="nbMinWidth" no-decimal="true" no-negative="true" label="对话框最小宽度"></f:number-box>
                            <f:number-box id="nbMaxWidth" no-decimal="true" no-negative="true" label="对话框最大宽度"></f:number-box>
                            <f:radio-button-list id="rblTarget" label="弹出位置" column-number="3">
                                <f:items>
                                    <f:radio-item value="Self" text="当前页面" selected="true"></f:radio-item>
                                    <f:radio-item value="Parent" text="父页面"></f:radio-item>
                                    <f:radio-item value="Top" text="顶层页面"></f:radio-item>
                                </f:items>
                            </f:radio-button-list>
                        </f:items>
                    </f:group-panel>
                </f:items>
                <f:toolbars>
                    <f:toolbar position="Bottom" toolbar-align="Right">
                        <f:items>
                            <f:button id="btnHello" text="点击弹出输入对话框" validate-forms="SimpleForm1" on-click="btnSubmit_Click"></f:button>
                            <f:button id="btnCallback" text="服务端输入框（确定与取消回调）" on-click="btnCallback_Click"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:form>

        </th:block>

        <th:block layout:fragment="script">
            <script>
                function promptOKCallback(message) {
                    var encodedMessage = F.htmlEncode(message).replace(/\r\n/ig, '\n').replace(/\r/ig, '\n').replace(/\n/ig, '<br/>');
                    F.notify(F.rawHtml("你输入的住址是：" + encodedMessage));
                }

                function onPromptAccepted(value) {
                    F.customEvent('PromptAccepted', value);
                }

                function onPromptDismissed(value) {
                    window.__promptCancelCount = (window.__promptCancelCount || 0) + 1;
                    F.customEvent('PromptDismissed', value);
                }

                function onMultiLineChange(event) {
                    var checked = this.getValue();

                    F.ui.nbMultiLineHeight.setHidden(!checked);
                    F.ui.cbxIsPassword.setHidden(!checked);
                }

            </script>
        </th:block>
    </body>

</html>
