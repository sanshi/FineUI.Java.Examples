<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · HBox 自动高度布局</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="Panel5" is-fluid="true" show-border="true" enable-collapse="false" layout="HBox" auto-scroll="true" show-header="true"
                title="面板（Layout=HBox AutoScroll=true）" box-config-child-margin="0 5 0 0" body-padding="5">
                <f:items>
                    <f:panel id="Panel1" title="面板1" width="600" body-padding="10" show-border="true" show-header="false">
                        <f:items>
                            <f:label id="Label1" text="Width=600">
                            </f:label>
                        </f:items>
                    </f:panel>
                    <f:panel id="Panel2" title="面板2" box-flex="1" min-width="600" margin="0" body-padding="10" show-border="true" show-header="false">
                        <f:items>
                            <f:label id="Label3"
                                text-raw-html="BoxFlex=1<br>Margin=0<br>MinWidth=600<br><br><br><br><br><br><br><br><br><br><br><br><br><br><br><br>bottom line">
                            </f:label>
                        </f:items>
                    </f:panel>
                </f:items>
            </f:panel>

        </th:block>
    </body>

</html>
