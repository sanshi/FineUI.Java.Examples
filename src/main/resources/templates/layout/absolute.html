<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 绝对布局</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="Panel2" is-fluid="true" height="500" show-border="true" enable-collapse="false" layout="Absolute" show-header="true"
                title="面板（Height=450 Width=750 Layout=Absolute）">
                <f:items>
                    <f:panel id="Panel1" width="300" title="Panel1" height="300" absolute-x="100" body-padding="10" absolute-y="50" show-border="true"
                        show-header="false">
                        <f:items>
                            <f:label id="Label3" text-raw-html="Width=300 <br/>Height=300 <br/>AbsoluteX=100 <br/>AbsoluteY=50"></f:label>
                        </f:items>
                    </f:panel>
                    <f:panel id="Panel3" title="Panel2" width="150" height="150" absolute-x="450" body-padding="10" absolute-y="150" show-border="true"
                        show-header="false">
                        <f:items>
                            <f:label id="Label1" text-raw-html="Width=150 <br/>Height=150 <br/>AbsoluteX=450 <br/>AbsoluteY=150"></f:label>
                        </f:items>
                    </f:panel>
                </f:items>
            </f:panel>

        </th:block>
    </body>

</html>
