<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · HBox 布局</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="Panel2" is-fluid="true" height="350" show-border="true" enable-collapse="false" layout="HBox" body-padding="10"

                <f:items>
                    <f:panel id="Panel1" title="面板1" box-flex="1" body-padding="10" show-border="true" show-header="false">
                        <f:items>
                            <f:label id="Label1" text="BoxFlex=1"></f:label>
                        </f:items>
                    </f:panel>
                    <f:panel id="Panel3" title="面板2" width="150" body-padding="10" show-border="true" show-header="false">

            <br /><br />
