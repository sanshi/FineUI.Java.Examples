<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 保存列锁定状态与列顺序</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name"
                allow-column-locking="true" width="1000">
                <f:columns>
                    <f:row-number-field column-id="RowNumber"></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name" enable-lock="true"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender" enable-lock="true"></f:render-field>
                    <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int" enable-lock="true"></f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true" enable-lock="true"></f:render-check-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" width="400" enable-lock="true"></f:render-field>
                    <f:render-field enable-lock="true" data-field="ShenGao" column-id="ShenGao" header-text="身高"></f:render-field>
                    <f:render-field enable-lock="true" data-field="TiZhong" column-id="TiZhong" header-text="体重"></f:render-field>
                    <f:render-field enable-lock="true" data-field="XueYaDi" column-id="XueYaDi" header-text="血压（低）"></f:render-field>
                    <f:render-field enable-lock="true" data-field="XueYaGao" column-id="XueYaGao" header-text="血压（高）"></f:render-field>
                    <f:render-field enable-lock="true" data-field="ShiLiZuo" column-id="ShiLiZuo" header-text="视力（左）"></f:render-field>
                    <f:render-field enable-lock="true" data-field="ShiLiYou" column-id="ShiLiYou" header-text="视力（右）"></f:render-field>
                    <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup" enable-lock="true"></f:render-field>
                    <f:render-field header-text="注册日期" data-field="LogTime" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd"
                        enable-lock="true"></f:render-field>
                </f:columns>
                <f:listeners>
                    <f:listener event="columnlock" handler="onGridColumnLock"></f:listener>
                    <f:listener event="columnunlock" handler="onGridColumnUnlock"></f:listener>
                </f:listeners>
            </f:grid>
            <br /><br />
            <f:button id="btnRefresh" text="刷新本页面（保持列锁定状态和列顺序）" click-handler="onReloadPageClick"></f:button>
        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script>
                function saveToDB(grid) {
                    var configedColumns = $.map(grid.columns, function(column) {
                        return {
                            ColumnID: column.columnId,
                            Locked: column.locked
                        };
                    });
                    F.customEvent('Grid1_ColumnLockUnlock', {
                        configedColumns: configedColumns
                    });
                }

                function onGridColumnLock(event, columnId) {
                    saveToDB(this);
                }

                function onGridColumnUnlock(event, columnId) {
                    saveToDB(this);
                }

                function onReloadPageClick(event) {
                    window.location.reload();
                }

            </script>
        </th:block>
    </body>

</html>
