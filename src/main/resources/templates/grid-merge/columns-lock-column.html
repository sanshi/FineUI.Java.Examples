<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 列合并 + 列锁定</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name"
                enable-column-lines="true" allow-column-locking="true">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="ID" data-field="Id" enable-lock="true" locked="true"></f:render-field>
                    <f:render-field header-text="姓名" data-field="Name" enable-lock="true" locked="true"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender" enable-lock="true"></f:render-field>
                    <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int" enable-lock="true"></f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true" enable-lock="true"></f:render-check-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" width="300" enable-lock="true"></f:render-field>
                    <f:render-field header-text="分组A" data-field="Group" renderer-function="renderGroup" enable-lock="true"></f:render-field>
                    <f:render-field header-text="分组B" data-field="GroupB" renderer-function="renderGroup" enable-lock="true"></f:render-field>
                    <f:render-field header-text="注册日期" data-field="LogTime" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd"
                        enable-lock="true"></f:render-field>
                </f:columns>
                <f:listeners>
                    <f:listener event="dataload" handler="onGridDataLoad"></f:listener>
                </f:listeners>
            </f:grid>
            <br />
            <f:button text="选中了哪些行" click-handler="onNotifySelectedRowsClick"></f:button>
            <br />
            <br />
        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script>
                function onGridDataLoad(event) {
                    this.mergeColumns(['EntranceYear', 'Major']);
                }

            </script>
        </th:block>
    </body>

</html>
