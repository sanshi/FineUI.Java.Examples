<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 结束编辑（含税价与不含税价，F.noEvent）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格（双击编辑）" data-id-field="Id" data-text-field="Name"
                allow-cell-editing="true" clicks-to-edit="2" enable-check-box-select="true" height="350">
                <f:listeners>
                    <f:listener event="afteredit" handler="onGrid1AfterEdit"></f:listener>
                    <f:listener event="rowcommand" handler="onGrid1RowCommand"></f:listener>
                </f:listeners>
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field column-id="Name" data-field="Name" header-text="应税名称" expand-unused-space="true">
                        <f:editor>
                            <f:text-box id="tbxEditorName">
                            </f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field width="150" column-id="Price" data-field="Price" field-type="Float" header-text="金额（不含税）">
                        <f:editor>
                            <f:number-box id="TextBox1" no-decimal="false" no-negative="true" required="true">
                            </f:number-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field width="150" column-id="PriceWithTax" data-field="PriceWithTax" field-type="Float" header-text="金额（含税）">
                        <f:editor>
                            <f:number-box id="NumberBox1" no-decimal="false" no-negative="true" required="true">
                            </f:number-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field column-id="TaxPercent" data-field="TaxPercent" field-type="Float" header-text="征收率">
                    </f:render-field>
                    <f:render-field width="150" column-id="Tax" data-field="Tax" field-type="Float" header-text="税额">
                        <f:editor>
                            <f:number-box id="NumberBox2" no-decimal="false" no-negative="true" required="true">
                            </f:number-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field enable-header-menu="false">
                        <f:commands>
                            <f:command command-name="Delete" icon="Delete" confirm-text="删除选中行？" confirm-target="Top"></f:command>
                        </f:commands>
                    </f:render-field>
                </f:columns>
                <f:toolbars>
                    <f:toolbar>
                        <f:items>
                            <f:button id="btnNew" text="新增数据" icon="Add" click-handler="onNewClick"></f:button>
                            <f:button id="btnDelete" text="删除选中行" icon="Delete" click-handler="onDeleteClick"></f:button>
                            <f:toolbar-fill></f:toolbar-fill>
                            <f:button id="btnReset" text="重置表格数据" click-handler="onResetClick"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:grid>

            <br>
            <f:button id="btnSubmit" text="保存数据" click-handler="onSubmitClick"></f:button>

            <br>
            <f:label id="labResult" encode-text="false"></f:label>

            <br />
            注：编辑[金额（不含税）]、[金额（含税）]、[税额]中的任一列，其他两列的值都会相应的改变。

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script>
                function onGrid1AfterEdit(event, value, params) {
                    var grid1 = this,
                        columnId = params.columnId,
                        rowId = params.rowId;

                    // 本次操作过程中禁止触发事件（防止循环事件）
                    F.noEvent(function() {
                        if (columnId === 'Price') {
                            var priceWithTax = (value * 1.03).toFixed(2);
                            var tax = (parseFloat(priceWithTax) - value).toFixed(2);

                            grid1.updateCellValue(rowId, 'PriceWithTax', priceWithTax);
                            grid1.updateCellValue(rowId, 'Tax', tax);
                        } else if (columnId === 'PriceWithTax') {
                            var price = (value / 1.03).toFixed(2);
                            var tax = (value - parseFloat(price)).toFixed(2);

                            grid1.updateCellValue(rowId, 'Price', price);
                            grid1.updateCellValue(rowId, 'Tax', tax);
                        } else if (columnId === 'Tax') {
                            var price = (value / 0.03).toFixed(2);
                            var priceWithTax = (value + parseFloat(price)).toFixed(2);

                            grid1.updateCellValue(rowId, 'Price', price);
                            grid1.updateCellValue(rowId, 'PriceWithTax', priceWithTax);
                        }
                    });
                }

                function onSubmitClick(event) {
                    var grid1 = F.ui.Grid1;

                    // 触发后台事件
                    F.customEvent('Submit_Click', {
                        mergedData: grid1.getMergedData()
                    });
                }

                function onNewClick(event) {
                    var grid1 = F.ui.Grid1;

                    // 新增一行（返回新增行的ID）
                    var addedRowId = grid1.addNewRecord({
                        'Name': '技术服务',
                        'TaxPercent': 0.03,
                    }, true);

                }

                function onResetClick(event) {
                    F.confirm({
                        message: '确定要重置表格数据？',
                        ok: function() {
                            F.ui.Grid1.rejectChanges();
                        }
                    });
                }

                function onDeleteClick(event) {
                    var grid1 = F.ui.Grid1;
                    if (!grid1.hasSelection()) {
                        F.alert('没有选中项！');
                        return;
                    }

                    var selectedRows = grid1.getSelectedRows();
                    F.confirm({
                        message: F.rawHtml('你确定要删除选中的&nbsp;<b>' + selectedRows.length + '</b>&nbsp;行数据吗？'),
                        target: '_top',
                        ok: function() {
                            grid1.deleteRows(selectedRows);
                        }
                    });
                }

                // 行命令
                function onGrid1RowCommand(event, rowId, rowIndex, columnId, commandName) {
                    if (commandName === 'Delete') {
                        F.ui.Grid1.deleteRow(rowId);
                    }
                }

            </script>
        </th:block>
    </body>

</html>
