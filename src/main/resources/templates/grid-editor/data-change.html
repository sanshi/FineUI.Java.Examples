<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 数据改变（启用禁用保存按钮）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格（双击编辑）" data-id-field="Id" data-text-field="Name"
                allow-cell-editing="true" clicks-to-edit="2" enable-check-box-select="true">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" column-id="Name" data-field="Name">
                        <f:editor>
                            <f:text-box id="tbxName" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="性别" column-id="Gender" data-field="Gender" field-type="Int" renderer-function="renderGender">
                        <f:editor>
                            <f:drop-down-list id="ddlGender" required="true">
                                <f:list-item text="男" value="1"></f:list-item>
                                <f:list-item text="女" value="0"></f:list-item>
                            </f:drop-down-list>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="入学年份" column-id="EntranceYear" data-field="EntranceYear" field-type="Int">
                        <f:editor>
                            <f:number-box id="nbxEntranceYear" no-decimal="true" no-negative="true" min-value="2000" max-value="2025"></f:number-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="入学日期" column-id="EntranceDate" data-field="EntranceDate" field-type="Date" renderer="Date"
                        renderer-argument="yyyy/MM/dd" width="150">
                        <f:editor>
                            <f:date-picker id="dpEntranceDate" required="true"></f:date-picker>
                        </f:editor>
                    </f:render-field>
                    <f:render-check-field header-text="是否在校" column-id="AtSchool" data-field="AtSchool"></f:render-check-field>
                    <f:render-field header-text="所学专业" column-id="Major" data-field="Major" expand-unused-space="true" min-width="150">
                        <f:editor>
                            <f:text-box id="tbxMajor" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field enable-header-menu="false">
                        <f:commands>
                            <f:command command-name="Delete" icon="Delete" confirm-text="删除选中行？" confirm-target="Top"></f:command>
                        </f:commands>
                    </f:render-field>
                </f:columns>
                <f:listeners>
                    <f:listener event="datachange" handler="onGrid1DataChange"></f:listener>
                    <f:listener event="rowcommand" handler="onGrid1RowCommand"></f:listener>
                </f:listeners>
                <f:toolbars>
                    <f:toolbar>
                        <f:items>
                            <f:button id="btnNew" text="新增数据" icon="Add" click-handler="onNewClick"></f:button>
                            <f:button id="btnDelete" text="删除选中行" icon="Delete" click-handler="onDeleteClick"></f:button>
                            <f:toolbar-fill></f:toolbar-fill>
                            <f:button id="btnReset" text="重置表格数据" click-handler="onResetClick"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:grid>

            <br>
            <f:button id="btnSubmit" text="保存数据" enabled="false" on-click="btnSubmit_Click"></f:button>
            <f:button id="btnRejectChanges" text="服务端撤销编辑" confirm-text="确定要撤销未保存的编辑？" on-click="btnRejectChanges_Click"></f:button>
            <f:button id="btnReadChanges" text="读取修改记录" on-click="btnReadChanges_Click"></f:button>
            <f:button id="btnCommitChanges" text="仅确认客户端编辑" on-click="btnCommitChanges_Click"></f:button>
            <br>
            <br>
            <f:button id="btnUpdateCells" text="服务端修改 101 行" on-click="btnUpdateCells_Click"></f:button>
            <f:button id="btnUpdateAndCommit" text="服务端修改并确认" on-click="btnUpdateAndCommit_Click"></f:button>
            <f:button id="btnAddRecord" text="服务端插入第二行" on-click="btnAddRecord_Click"></f:button>
            <f:button id="btnAppendRecord" text="服务端追加末行" on-click="btnAppendRecord_Click"></f:button>
            <f:button id="btnDeleteRow" text="服务端删除 101 行" on-click="btnDeleteRow_Click"></f:button>
            <f:button id="btnForceDeleteRow" text="强制移除 102 行" on-click="btnForceDeleteRow_Click"></f:button>
            <f:button id="btnDeleteSelected" text="服务端删除选中行" on-click="btnDeleteSelected_Click"></f:button>

            <br>
            <f:label id="labResult" encode-text="false"></f:label>
            <br>
            <br>
            注：
            <ul>
                <li>[保存数据]按钮默认禁用，当有数据变化时（删除行，新增行，修改单元格）启用</li>
                <li>数据重新绑定后，重新检查[保存数据]按钮的启用状态</li>
                <li>[仅确认客户端编辑]保留当前结果并清除修改记录，不保存数据；之后撤销以该结果为准，刷新页面仍读取原数据源</li>
                <li>[服务端修改并确认]在一次回发中先修改单元格、再确认编辑基线；可用[读取修改记录]检查命令顺序的结果</li>
                <li>[服务端撤销编辑]通过回发撤销未保存的修改，不重绑数据或回滚已保存的数据；撤销后可[读取修改记录]核对结果</li>
            </ul>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                function onGrid1DataChange(event) {
                    var grid1 = F.ui.Grid1;
                    var btnSubmit = F.ui.btnSubmit;

                    // 如果没有删除行，没有新增行，没有修改的数据
                    if (!grid1.getModifiedData().length) {
                        btnSubmit.disable();
                    } else {
                        btnSubmit.enable();
                    }
                }

                function onNewClick(event) {
                    var grid1 = F.ui.Grid1;

                    // 新增一行（返回新增行的ID）
                    var addedRowId = grid1.addNewRecord({
                        'Name': '新用户',
                        'Gender': '1',
                        'EntranceYear': '2015',
                        'EntranceDate': '2016-11-15',
                        'AtSchool': false,
                        'Major': '化学系'
                    }, true);

                }

                function onResetClick(event) {
                    F.confirm({
                        message: '确定要重置表格数据？',
                        ok: function() {
                            F.ui.Grid1.rejectChanges();
                        }
                    });
                }

                function onDeleteClick(event) {
                    var grid1 = F.ui.Grid1;
                    if (!grid1.hasSelection()) {
                        F.alert('没有选中项！');
                        return;
                    }

                    var selectedRows = grid1.getSelectedRows();
                    F.confirm({
                        message: F.rawHtml('你确定要删除选中的&nbsp;<b>' + selectedRows.length + '</b>&nbsp;行数据吗？'),
                        target: '_top',
                        ok: function() {
                            grid1.deleteRows(selectedRows);
                        }
                    });
                }

                // 行命令
                function onGrid1RowCommand(event, rowId, rowIndex, columnId, commandName) {
                    if (commandName === 'Delete') {
                        F.ui.Grid1.deleteRow(rowId);
                    }
                }

            </script>
        </th:block>
    </body>

</html>
