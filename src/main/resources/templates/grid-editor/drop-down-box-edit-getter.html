<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 从下拉表格中快速选择（自定义编辑器获取函数）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格（进入编辑状态后，从下拉表格中选择用户）" height="350" data-id-field="Id"
                data-text-field="Name" allow-cell-editing="true" clicks-to-edit="1">
                <f:listeners>
                    <f:listener event="rowcommand" handler="onGrid1RowCommand"></f:listener>
                </f:listeners>
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" column-id="Name" data-field="Name" edit-getter-function="editGetterName"
                        edit-setter-function="editSetterName">
                        <f:editor>
                            <f:drop-down-box id="DropDownBox1" empty-text="请选择" match-field-width="false" enable-multi-select="false">
                                <f:pop-panel>
                                    <f:grid id="Grid2" show-border="true" show-header="false" data-id-field="Id" data-text-field="Name" hidden="true"
                                        width="650" height="300" enable-multi-select="false">
                                        <f:listeners>
                                            <f:listener event="rowclick" handler="onGrid2RowClick"></f:listener>
                                        </f:listeners>
                                        <f:columns>
                                            <f:row-number-field></f:row-number-field>
                                            <f:render-field column-id="Name" data-field="Name" header-text="姓名"></f:render-field>
                                            <f:render-field column-id="Gender" data-field="Gender" field-type="Int" renderer-function="renderGender"
                                                header-text="性别"></f:render-field>
                                            <f:render-field column-id="EntranceYear" data-field="EntranceYear" header-text="入学年份"></f:render-field>
                                            <f:render-field column-id="EntranceDate" data-field="EntranceDate" field-type="Date" renderer="Date"
                                                renderer-argument="yyyy/MM/dd" header-text="入学日期"></f:render-field>
                                            <f:render-check-field column-id="AtSchool" data-field="AtSchool" header-text="是否在校"></f:render-check-field>
                                            <f:render-field column-id="Major" data-field="Major" header-text="所学专业" expand-unused-space="true"></f:render-field>
                                        </f:columns>
                                    </f:grid>
                                </f:pop-panel>
                            </f:drop-down-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="编码" column-id="Code" data-field="Code"></f:render-field>
                    <f:render-field header-text="性别" column-id="Gender" data-field="Gender" field-type="Int" renderer-function="renderGender">
                        <f:editor>
                            <f:drop-down-list id="ddlGender" required="true">
                                <f:list-item text="男" value="1"></f:list-item>
                                <f:list-item text="女" value="0"></f:list-item>
                            </f:drop-down-list>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="入学年份" column-id="EntranceYear" data-field="EntranceYear" field-type="Int">
                        <f:editor>
                            <f:number-box id="nbxEntranceYear" no-decimal="true" no-negative="true" min-value="2000" max-value="2025"></f:number-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="入学日期" column-id="EntranceDate" data-field="EntranceDate" field-type="Date" renderer="Date"
                        renderer-argument="yyyy/MM/dd" width="150">
                        <f:editor>
                            <f:date-picker id="dpEntranceDate" required="true"></f:date-picker>
                        </f:editor>
                    </f:render-field>
                    <f:render-check-field header-text="是否在校" column-id="AtSchool" data-field="AtSchool"></f:render-check-field>
                    <f:render-field header-text="所学专业" column-id="Major" data-field="Major" expand-unused-space="true" min-width="150">
                        <f:editor>
                            <f:text-box id="tbxMajor" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field enable-header-menu="false">
                        <f:commands>
                            <f:command command-name="Delete" icon="Delete" confirm-text="删除选中行？" confirm-target="Top"></f:command>
                        </f:commands>
                    </f:render-field>
                </f:columns>
                <f:toolbars>
                    <f:toolbar>
                        <f:items>
                            <f:button id="btnNew" text="新增数据" icon="Add" click-handler="onNewClick"></f:button>
                            <f:button id="btnDelete" text="删除选中行" icon="Delete" click-handler="onDeleteClick"></f:button>
                            <f:toolbar-fill></f:toolbar-fill>
                            <f:button id="btnReset" text="重置表格数据" click-handler="onResetClick"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:grid>

            <br>
            <f:button id="btnSubmit" text="保存数据" on-click="btnSubmit_Click"></f:button>

            <br>
            <f:label id="labResult" encode-text="false"></f:label>

            <br>
            <br>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script>
                // 自定义编辑器获取函数（从Editor返回单元格）
                function editGetterName(editor) {
                    return editor.getText();
                }

                // 自定义编辑器设置函数（从单元格进入Editor）
                function editSetterName(editor, val, columnId, rowId) {
                    var grid1 = F.ui.Grid1;
                    var rowValue = grid1.getRowValue(rowId);
                    var rowCode = rowValue['Code'];

                    editor.setValue(rowCode, val);
                }

                function onGrid2RowClick(event, grid2RowId) {
                    var grid1 = F.ui.Grid1;
                    var grid1RowId = grid1.getSelectedCell()[0];
                    var rowValue = this.getRowValue(grid2RowId);

                    grid1.updateCellValue(grid1RowId, {
                        'Code': grid2RowId,
                        'Name': rowValue.Name,
                        'Gender': rowValue.Gender,
                        'EntranceYear': rowValue.EntranceYear,
                        'EntranceDate': rowValue.EntranceDate,
                        'AtSchool': rowValue.AtSchool,
                        'Major': rowValue.Major
                    });
                }

                function onNewClick(event) {
                    var grid1 = F.ui.Grid1;

                    // 新增一行（返回新增行的ID）
                    var addedRowId = grid1.addNewRecord({
                        'Name': '新用户',
                        'Gender': '1',
                        'EntranceYear': '2015',
                        'EntranceDate': '2016-11-15',
                        'AtSchool': false,
                        'Major': '化学系'
                    }, true);

                }

                function onResetClick(event) {
                    F.confirm({
                        message: '确定要重置表格数据？',
                        ok: function() {
                            F.ui.Grid1.rejectChanges();
                        }
                    });
                }

                function onDeleteClick(event) {
                    var grid1 = F.ui.Grid1;
                    if (!grid1.hasSelection()) {
                        F.alert('没有选中项！');
                        return;
                    }

                    var selectedRows = grid1.getSelectedRows();
                    F.confirm({
                        message: F.rawHtml('你确定要删除选中的&nbsp;<b>' + selectedRows.length + '</b>&nbsp;行数据吗？'),
                        target: '_top',
                        ok: function() {
                            grid1.deleteRows(selectedRows);
                        }
                    });
                }

                // 行命令
                function onGrid1RowCommand(event, rowId, rowIndex, columnId, commandName) {
                    if (commandName === 'Delete') {
                        F.ui.Grid1.deleteRow(rowId);
                    }
                }

            </script>
        </th:block>
    </body>

</html>
