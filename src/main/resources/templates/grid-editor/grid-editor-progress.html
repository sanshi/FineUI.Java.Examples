<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 单元格编辑（进度条）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name"
                allow-cell-editing="true" clicks-to-edit="1">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" column-id="Name" data-field="Name">
                        <f:editor>
                            <f:text-box id="tbxName" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="性别" column-id="Gender" data-field="Gender" field-type="Int" renderer-function="renderGender">
                        <f:editor>
                            <f:drop-down-list id="ddlGender" required="true">
                                <f:list-item text="男" value="1"></f:list-item>
                                <f:list-item text="女" value="0"></f:list-item>
                            </f:drop-down-list>
                        </f:editor>
                    </f:render-field>
                    <f:render-field width="200" column-id="Progress1" data-field="Progress1" field-type="Int" header-text="进度条1"
                        renderer-function="renderProgress1"></f:render-field>
                    <f:render-field width="200" column-id="Progress2" data-field="Progress2" field-type="Int" header-text="进度条2"
                        renderer-function="renderProgress2"></f:render-field>
                    <f:render-field header-text="所学专业" column-id="Major" data-field="Major" expand-unused-space="true" min-width="150">
                        <f:editor>
                            <f:text-box id="tbxMajor" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                </f:columns>
            </f:grid>
            <br />
            <f:button id="Button1" text="[进度条1]加5%" margin-right="5" click-handler="onIncreaseProgressClick"></f:button>
            <f:button id="Button3" text="[进度条1]减5%" click-handler="onDecreaseProgressClick"></f:button>
            <br />
            <br />
            <f:button id="btnSubmit" text="保存数据" on-click="btnSubmit_Click"></f:button>

            <br>
            <f:label id="labResult" encode-text="false"></f:label>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                function renderProgress1(value) {
                    return F.progressHtml(value, {
                        textVisible: true
                    });
                }

                function renderProgress2(value) {
                    return F.progressHtml(value, {
                        height: 15,
                        textVisible: true,
                        textInside: true
                    });
                }

                function changeProgress1(increment) {
                    var grid1 = F.ui.Grid1;
                    grid1.getRowEls().each(function() {
                        var rowEl = $(this);
                        var progressEl = rowEl.find('.f-grid-cell-Progress1 .f-progressbar-outer');
                        var progressValue = parseInt(progressEl.attr('data-progressvalue'));

                        progressValue += increment;

                        if (progressValue > 100) {
                            progressValue = 100;
                        } else if (progressValue < 0) {
                            progressValue = 0;
                        }

                        grid1.updateCellValue(rowEl, 'Progress1', progressValue);
                    });
                }

                function onIncreaseProgressClick(event) {
                    changeProgress1(5);
                }

                function onDecreaseProgressClick(event) {
                    changeProgress1(-5);
                }

            </script>
        </th:block>
    </body>

</html>
