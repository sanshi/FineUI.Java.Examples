<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 禁止列编辑（f-grid-cell-uneditable）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格（单击编辑）" data-id-field="Id" data-text-field="Name"
                allow-cell-editing="true" clicks-to-edit="1">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" column-id="Name" data-field="Name">
                        <f:editor>
                            <f:text-box id="tbxName" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="性别" column-id="Gender" data-field="Gender" field-type="Int" renderer-function="renderGender">
                        <f:editor>
                            <f:drop-down-list id="ddlGender" required="true">
                                <f:list-item text="男" value="1"></f:list-item>
                                <f:list-item text="女" value="0"></f:list-item>
                            </f:drop-down-list>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="入学年份" column-id="EntranceYear" data-field="EntranceYear" field-type="Int">
                        <f:editor>
                            <f:number-box id="nbxEntranceYear" no-decimal="true" no-negative="true" min-value="2000" max-value="2025"></f:number-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="入学日期" column-id="EntranceDate" data-field="EntranceDate" field-type="Date" renderer="Date"
                        renderer-argument="yyyy/MM/dd" width="150">
                        <f:editor>
                            <f:date-picker id="dpEntranceDate" required="true"></f:date-picker>
                        </f:editor>
                    </f:render-field>
                    <f:render-check-field header-text="是否在校" column-id="AtSchool" data-field="AtSchool"></f:render-check-field>
                    <f:render-field header-text="所学专业" column-id="Major" data-field="Major" expand-unused-space="true" min-width="150"
                        enable-column-edit="false">
                        <f:editor>
                            <f:text-box id="tbxMajor" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                </f:columns>
                <f:listeners>
                    <f:listener event="dataload" handler="onGrid1DataLoad"></f:listener>
                </f:listeners>
            </f:grid>

            <br>
            <f:button id="btnChangeEntranceDateEditable" text="切换[入学日期]列的可编辑状态" css-class="marginr" click-handler="onChangeEntranceDateEditableClick">
            </f:button>
            <f:button id="btnChangeAtSchoolEditable" text="切换[是否在校]列的可编辑状态" css-class="marginr" click-handler="onChangeAtSchoolEditableClick"></f:button>
            <f:button id="btnChangeMajorEditable" text="切换[所学专业]列的可编辑状态" css-class="marginr" click-handler="onChangeMajorEditableClick"></f:button>

            <br>
            <br>
            <f:button id="btnSubmit" text="保存数据" on-click="btnSubmit_Click"></f:button>

            <br>
            <f:label id="labResult" encode-text="false"></f:label>

            <br>
            注：初始[所学专业]列不可编辑，可以通过上述按钮切换列的编辑状态。

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                function onGrid1DataLoad(event) {
                    var grid = this;

                    // 对于指定的列，如果不可编辑，则增加 f-grid-cell-uneditable 样式类
                    grid.bodyEl.find('.f-grid-cell-EntranceDate, .f-grid-cell-AtSchool, .f-grid-cell-Major').each(function() {
                        var cellEl = $(this);

                        if (!cellEl.hasClass('f-grid-cell-editable')) {
                            cellEl.addClass('f-grid-cell-uneditable');
                        }
                    });
                }

                function onChangeEntranceDateEditableClick(event) {
                    var column = F.ui.Grid1.getColumn('EntranceDate');
                    column.toggleEditable();
                }

                function onChangeAtSchoolEditableClick(event) {
                    var column = F.ui.Grid1.getColumn('AtSchool');
                    column.toggleEditable();
                }

                function onChangeMajorEditableClick(event) {
                    var column = F.ui.Grid1.getColumn('Major');
                    column.toggleEditable();
                }

            </script>
        </th:block>
    </body>

</html>
