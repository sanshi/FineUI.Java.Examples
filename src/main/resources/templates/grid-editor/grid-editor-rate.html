<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 单元格编辑（评分）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name"
                allow-cell-editing="true" clicks-to-edit="1">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" column-id="Name" data-field="Name">
                        <f:editor>
                            <f:text-box id="tbxName" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="性别" column-id="Gender" data-field="Gender" field-type="Int" renderer-function="renderGender">
                        <f:editor>
                            <f:drop-down-list id="ddlGender" required="true">
                                <f:list-item text="男" value="1"></f:list-item>
                                <f:list-item text="女" value="0"></f:list-item>
                            </f:drop-down-list>
                        </f:editor>
                    </f:render-field>
                    <f:render-field width="150" column-id="Rate1" data-field="Rate1" field-type="Int" header-text="只读评分"
                        renderer-function="renderRate1"></f:render-field>
                    <f:render-field width="200" column-id="Rate2" data-field="Rate2" field-type="Int" header-text="五星评分"
                        renderer-function="renderRate2"></f:render-field>
                    <f:render-field width="200" column-id="Rate3" data-field="Rate3" field-type="Float" header-text="自定义评分"
                        renderer-function="renderRate3"></f:render-field>
                    <f:render-field header-text="所学专业" column-id="Major" data-field="Major" expand-unused-space="true" min-width="150">
                        <f:editor>
                            <f:text-box id="tbxMajor" required="true"></f:text-box>
                        </f:editor>
                    </f:render-field>
                </f:columns>
            </f:grid>
            <br />
            <f:button id="btnSubmit" text="保存数据" on-click="btnSubmit_Click"></f:button>

            <br>
            <f:label id="labResult" encode-text="false"></f:label>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                var desc = ['terrible', 'bad', 'normal', 'good', 'wonderful'];

                function renderRate2Text(val) {
                    var rateText = '-';
                    if (val > 0) {
                        rateText = desc[val - 1];
                    }
                    return rateText;
                }

                function renderRate1(value) {
                    return F.rateHtml(value, {
                        readonly: true
                    });
                }

                function renderRate2(value) {
                    return F.rateHtml(value, {
                        textVisible: true,
                        textRenderer: renderRate2Text
                    });
                }

                function renderRate3(value) {
                    return F.rateHtml(value, {
                        allowHalf: true,
                        iconFont: 'f-iconfont-trophy',
                        textVisible: true
                    });
                }

                F.ready(function() {

                    var grid1 = F.ui.Grid1;

                    // 注册评分事件
                    F.rateEvents(grid1.el, function(event, value) {
                        var target = $(event.target);
                        var cellEl = target.closest('.f-grid-cell');

                        var rowId = grid1.getRowId(cellEl);
                        var columnId = grid1.getColumnId(cellEl);

                        // 更新单元格的值
                        grid1.updateCellValue(rowId, columnId, value);
                    });

                });

            </script>
        </th:block>
    </body>

</html>
