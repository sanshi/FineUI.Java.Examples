<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 默认值与明确覆盖</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <div style="padding:10px">
                <p>普通属性与控件基础默认值相同时，创建配置会省略该属性，页面行为保持一致；表单标签对齐等正式继承属性保留明确设置。
                    用浏览器「查看网页源代码」找到 <code>FineUIPageConfig</code> JSON 数据块，可核对各控件的配置。</p>

                <f:button id="btnInheritedSize" text="未设置大小（继承默认值）" css-class="marginr"></f:button>
                <f:button id="btnNormalSize" text="普通大小（省略默认配置）" size="Normal" css-class="marginr"></f:button>
                <f:button id="btnLargeSize" text="size=Large（非默认 → scale:large）" size="Large"></f:button>
                <br /><br />

                <f:button id="btnQtip" text="浮动提示（省略默认配置）" tool-tip-type="Qtip" tool-tip="提示" css-class="marginr"></f:button>
                <f:button id="btnTitleTip" text="tool-tip-type=Title（非默认 → tooltipType:title）" tool-tip-type="Title" tool-tip="提示"></f:button>
                <br /><br />

                <f:button id="btnLeftAlign" text="图标左对齐（省略默认配置）" icon="Add" icon-align="Left" css-class="marginr"></f:button>
                <f:button id="btnRightAlign" text="icon-align=Right（非默认 → iconAlign:right）" icon="Add" icon-align="Right"></f:button>
                <br /><br />

                <p>下面两张表单明确设置的标签对齐都会保留；普通文本输入类型可以省略，密码输入类型继续输出。</p>

                <f:simple-form id="FormDefault" is-fluid="true" body-padding="10" show-header="true" title="明确左对齐与普通文本输入"
                    label-align="Left">
                    <f:items>
                        <f:text-box id="tbxTextMode" label="普通文本输入" text-mode="Text"></f:text-box>
                    </f:items>
                </f:simple-form>

                <f:simple-form id="FormNonDefault" is-fluid="true" body-padding="10" show-header="true"
                    title="非默认（fieldDefaults:{labelAlign:right}、inputType:password）" label-align="Right">
                    <f:items>
                        <f:text-box id="tbxPassword" label="text-mode=Password（非默认 → inputType:password）" text-mode="Password"></f:text-box>
                    </f:items>
                </f:simple-form>
            </div>

        </th:block>
    </body>

</html>
