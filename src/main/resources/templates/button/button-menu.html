<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 菜单按钮</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:button id="btnMenu" text="中国科学技术大学" icon-font="_Bicycle">
                <f:menu>
                    <f:menu-hyper-link id="MenuHyperLink3" icon="TagGreen" target="_blank" navigate-url="http://scms.ustc.edu.cn/"
                        text="化学与材料科学学院"></f:menu-hyper-link>
                    <f:menu-button id="MenuButton1" icon="TagBlue" text="管理学院">
                        <f:menu>
                            <f:menu-hyper-link id="MenuHyperLink1" icon="TagPink" target="_blank" navigate-url="http://is.ustc.edu.cn/"
                                text="工商管理系"></f:menu-hyper-link>
                            <f:menu-hyper-link id="MenuHyperLink2" icon="TagPurple" target="_blank" navigate-url="http://stat.ustc.edu.cn/"
                                text="统计与金融系"></f:menu-hyper-link>
                        </f:menu>
                    </f:menu-button>
                </f:menu>
            </f:button>

        </th:block>
    </body>

</html>
