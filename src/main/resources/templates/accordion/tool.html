<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 手风琴（工具图标）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:accordion id="Accordion1" is-fluid="true" title="手风琴控件" show-header="false" height="500" show-border="true" active-pane-index="1"
                enable-collapse="false">
                <f:panes>
                    <f:accordion-pane id="AccordionPane1" title="面板一" icon-url="/res/images/16/1.png" body-padding="2px 5px">
                        <f:items>
                            <f:label id="Label1" text="面板一中的文本"></f:label>
                        </f:items>
                        <f:tools>
                            <f:tool icon-font="_Gear" tool-tip="设置" click-handler="onToolIconClick"></f:tool>
                            <f:tool icon-font="_Download" tool-tip="下载" click-handler="onToolIconClick"></f:tool>
                        </f:tools>
                    </f:accordion-pane>
                    <f:accordion-pane id="AccordionPane2" title="面板二" icon-url="/res/images/16/4.png" body-padding="2px 5px">
                        <f:items>
                            <f:label id="Label2" text="面板二中的文本"></f:label>
                        </f:items>
                    </f:accordion-pane>
                    <f:accordion-pane id="AccordionPane3" title="面板三" icon-url="/res/images/16/7.png" body-padding="2px 5px">
                        <f:items>
                            <f:label id="Label3" text="面板三中的文本"></f:label>
                        </f:items>
                    </f:accordion-pane>
                </f:panes>
            </f:accordion>
            <br>

            <f:button id="Button1" text="获取当前展开的面板" on-click="Button1_Click"></f:button>
            <br>
            <br>

            <f:button id="Button2" text="展开下一个面板" on-click="Button2_Click"></f:button>
            <br>

        </th:block>
        <th:block layout:fragment="script">
            <script>
                function onToolIconClick(event) {

                    // 当前点击的图标字体
                    var iconFont = this.iconFont;

                    F.notify({
                        message: '你点击了标题栏工具图标：' + iconFont,
                        messageIconFont: iconFont,
                        displayMilliseconds: 3000,
                        positionX: 'center',
                        positionY: 'center'
                    });

                    // 阻止事件向上传播（点击工具图标时不会折叠展开面板）
                    event.stopPropagation();
                }

            </script>
        </th:block>
    </body>

</html>
