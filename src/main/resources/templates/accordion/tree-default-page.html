<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 默认页面</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            请注意，本示例如何做到如下几点：
            <ul>
                <li>如何将树控件放在 Accordion 控件中；</li>
                <li>如何从 XML 文件加载树控件；</li>
                <li>如何通过递归改变每个树节点的 Target 属性；</li>
                <li>树节点的 Target 属性是如何影响链接的打开位置。</li>
            </ul>
            <br />
            <br />
            <br />
            注：必须点击树节点文本才能打开相应的页面。如果希望点击树节点空白的地方也能打开，请设置 EnableNodeHyperLink=true。

        </th:block>
    </body>

</html>
