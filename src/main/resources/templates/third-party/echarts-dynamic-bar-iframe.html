<!DOCTYPE html>
<html style="height: 100%">

    <head>
        <title>ECharts 动态柱状图</title>
    </head>

    <body style="height: 100%; margin: 0">
        <div id="container" style="height: 100%"></div>
        <script th:src="@{/res/third-party/echarts/echarts.min.js}"></script>
        <script>
            var type = new URLSearchParams(window.location.search).get('type');
            var option;
            if (!type || type === 'sales') {
                option = {
                    color: ['#5793f3'],
                    title: {
                        text: '销量图表'
                    },
                    xAxis: {
                        type: 'category',
                        data: ['衬衫', '羊毛衫', '雪纺衫', '裤子', '高跟鞋', '袜子']
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [{
                        name: '销量',
                        type: 'bar',
                        data: [5, 20, 36, 10, 10, 20]
                    }]
                };
            } else {
                option = {
                    color: ['#d14a61'],
                    title: {
                        text: '产量图表'
                    },
                    xAxis: {
                        type: 'category',
                        data: ['衬衫', '羊毛衫', '雪纺衫', '裤子', '高跟鞋', '袜子']
                    },
                    yAxis: {
                        type: 'value'
                    },
                    series: [{
                        name: '销量',
                        type: 'bar',
                        data: [6, 18, 17, 35, 20, 5]
                    }]
                };
            }
            var chart = echarts.init(document.getElementById('container'));
            chart.setOption(option);

        </script>
    </body>

</html>
