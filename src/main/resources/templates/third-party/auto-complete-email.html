<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · AutoCompleteEmail</title>

        <link rel="stylesheet" th:href="@{/res/third-party/jqueryuiautocomplete/jquery-ui.css}" />
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" enable-collapse="false" title="简单表单">
                <f:items>
                    <f:text-box id="TextBox1" show-label="false" empty-text="随便输入个字母试试"></f:text-box>
                </f:items>
            </f:simple-form>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/third-party/jqueryuiautocomplete/jquery-ui.js}"></script>
            <script>
                F.ready(function() {
                    var availableTags = [
                        'qq.com', '163.com', 'gmail.com', 'outlook.com', '126.com', 'sina.com',
                        'yahoo.com', 'sohu.com', 'foxmail.com', 'live.com', 'mail.ustc.edu.cn'
                    ];

                    function getFullEmails(name) {
                        var emails = [];
                        for (var i = 0; i < availableTags.length; i++) {
                            emails.push(name + '@' + availableTags[i]);
                        }
                        return emails;
                    }

                    $('#TextBox1 input').autocomplete({
                        source: function(request, response) {
                            if (request.term.indexOf('@') === -1) {
                                response(getFullEmails(request.term));
                            }
                        }
                    });
                });

            </script>
        </th:block>
    </body>

</html>
