<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · EChartsTabStrip</title>

        <link rel="stylesheet" th:href="@{/res/third-party/openlayers/ol.css}" />
        <style>
            #chart,
            #olmap {
                height: 100%;
                width: 100%;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:tab-strip id="TabStrip1" is-view-port="true" css-class="mytabstrip" show-ink-bar="true" show-border="true" active-tab-index="0">
                <f:tabs>
                    <f:tab title="统计图" layout="Fit" body-padding="10">
                        <f:items>
                            <f:panel css-class="mycontentpanel" show-border="false" show-header="false" content="<div id='chart'></div>"></f:panel>
                        </f:items>
                    </f:tab>
                    <f:tab title="地图" layout="Fit" body-padding="10">
                        <f:items>
                            <f:panel css-class="mycontentpanel" show-border="false" show-header="false" content="<div id='olmap'></div>"></f:panel>
                        </f:items>
                    </f:tab>
                </f:tabs>
            </f:tab-strip>
            <div class="f-widget-content" id="emptycontent"></div>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/third-party/echarts/echarts.min.js}"></script>
            <script th:src="@{/res/third-party/openlayers/ol.js}"></script>
            <script>
                var myChart;
                var myMap;

                function emptyContentColor() {
                    return $('#emptycontent').css('color');
                }

                function randomColors() {
                    var colors = ['#c23531', '#2f4554', '#61a0a8', '#d48265', '#91c7ae', '#749f83', '#ca8622', '#bda29a', '#6e7074', '#546570', '#c4ccd3'];
                    var randomIndex = Math.random() * colors.length;
                    return $.merge(colors.slice(randomIndex), colors.slice(0, randomIndex));
                }

                function updateChartInTabStrip() {
                    if (F.ui.TabStrip1.getActiveTabIndex() === 0) {
                        myChart.resize();
                    } else {
                        myMap.updateSize();
                    }
                }

                F.ready(function() {
                    var contentColor = emptyContentColor();
                    myChart = echarts.init($('#chart')[0]);
                    myChart.setOption({
                        color: randomColors(),
                        title: {
                            text: '用户访问来源',
                            subtext: '这是说明文字',
                            x: 'center',
                            textStyle: {
                                color: contentColor
                            }
                        },
                        tooltip: {
                            trigger: 'item',
                            formatter: '{a} <br/>{b} : {c} ({d}%)'
                        },
                        legend: {
                            orient: 'vertical',
                            left: 'left',
                            textStyle: {
                                color: contentColor
                            },
                            data: ['直接访问', '邮件营销', '联盟广告', '视频广告', '搜索引擎']
                        },
                        series: [{
                            name: '访问来源',
                            type: 'pie',
                            radius: '55%',
                            center: ['50%', '60%'],
                            data: [{
                                    value: 335,
                                    name: '直接访问'
                                },
                                {
                                    value: 310,
                                    name: '邮件营销'
                                },
                                {
                                    value: 234,
                                    name: '联盟广告'
                                },
                                {
                                    value: 135,
                                    name: '视频广告'
                                },
                                {
                                    value: 1548,
                                    name: '搜索引擎'
                                }
                            ],
                            itemStyle: {
                                emphasis: {
                                    shadowBlur: 10,
                                    shadowOffsetX: 0,
                                    shadowColor: 'rgba(0, 0, 0, 0.5)'
                                }
                            }
                        }]
                    });

                    myMap = new ol.Map({
                        target: 'olmap',
                        layers: [new ol.layer.Tile({
                            source: new ol.source.OSM()
                        })],
                        view: new ol.View({
                            center: ol.proj.fromLonLat([104.114129, 34.550339]),
                            zoom: 4
                        })
                    });

                    F.ui.TabStrip1.on('tabchange', updateChartInTabStrip);
                    F.windowResize(updateChartInTabStrip);
                });

            </script>
        </th:block>
    </body>

</html>
