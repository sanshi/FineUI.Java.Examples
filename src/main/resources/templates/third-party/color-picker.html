<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · ColorPicker</title>

        <link rel="stylesheet" th:href="@{/res/third-party/spectrum/spectrum.css}" />
        <style>
            .mycolor .f-field-body {
                display: inline-block !important;
                width: 150px;
                margin-right: 5px;
            }

            .mycolor .sp-replacer {
                border-width: 0;
                background-color: transparent;
            }

            .mycolor .sp-dd {
                display: none;
            }

            .mycolor .sp-preview {
                margin-right: 0;
                height: 100%;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" enable-collapse="false" show-border="true" title="表单" show-header="true">
                <f:items>
                    <f:date-picker id="DatePicker1" required="true" label="日期一" empty-text="请选择日期一" show-red-star="true"></f:date-picker>
                    <f:text-box id="tbxMyBox" css-class="mycolor" text="#f90" required="true" show-red-star="true" label="选择颜色"></f:text-box>
                    <f:button id="btnSubmit" validate-forms="SimpleForm1" text="提交表单" on-click="btnSubmit_Click"></f:button>
                </f:items>
            </f:simple-form>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/third-party/spectrum/spectrum.js}"></script>
            <script th:src="@{/res/third-party/spectrum/i18n/jquery.spectrum-zh-cn.js}"></script>
            <script>
                F.ready(function() {
                    F.ui.tbxMyBox.bodyEl.spectrum({
                        preferredFormat: 'hex3',
                        showInput: true,
                        showPalette: true,
                        palette: [
                            ['#000', '#444', '#666', '#999', '#ccc', '#eee', '#f3f3f3', '#fff'],
                            ['#f00', '#f90', '#ff0', '#0f0', '#0ff', '#00f', '#90f', '#f0f'],
                            ['#f4cccc', '#fce5cd', '#fff2cc', '#d9ead3', '#d0e0e3', '#cfe2f3', '#d9d2e9', '#ead1dc'],
                            ['#ea9999', '#f9cb9c', '#ffe599', '#b6d7a8', '#a2c4c9', '#9fc5e8', '#b4a7d6', '#d5a6bd'],
                            ['#e06666', '#f6b26b', '#ffd966', '#93c47d', '#76a5af', '#6fa8dc', '#8e7cc3', '#c27ba0'],
                            ['#c00', '#e69138', '#f1c232', '#6aa84f', '#45818e', '#3d85c6', '#674ea7', '#a64d79'],
                            ['#900', '#b45f06', '#bf9000', '#38761d', '#134f5c', '#0b5394', '#351c75', '#741b47'],
                            ['#600', '#783f04', '#7f6000', '#274e13', '#0c343d', '#073763', '#20124d', '#4c1130']
                        ]
                    });
                });

            </script>
        </th:block>
    </body>

</html>
