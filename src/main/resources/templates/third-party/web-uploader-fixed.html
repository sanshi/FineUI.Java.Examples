<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · WebUploaderFixed</title>
        <!--/* 声明本页引用的其它源文件（分号分隔，每项写成 前缀:值，前缀有 route/template/class/res 四种，见 SourceFiles）：首页"查看源代码"把它们也渲染为选项卡 */-->
        <meta name="sourcefiles"
            content="class:com.fineui.java.examples.thirdparty.WebUploaderController;class:com.fineui.java.examples.web.DownloadController" />
        <!--/* 页面专属样式 */-->
        <style>
            .theuploadbutton {
                display: inline-block;
            }

            .webuploader-element-invisible {
                position: absolute !important;
                clip: rect(1px, 1px, 1px, 1px);
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-header="true" show-border="true" title="论文分段上传" height="350" enable-collapse="false"
                enable-check-box-select="false" empty-text="尚未上传文件" data-id-field="id">
                <f:columns>
                    <f:render-field column-id="SectionName" data-field="sectionname" header-text="章节"></f:render-field>
                    <f:render-field column-id="FileName" data-field="name" header-text="文件名" expand-unused-space="true" min-width="150"></f:render-field>
                    <f:render-field column-id="FileType" data-field="type" header-text="类型"></f:render-field>
                    <f:render-field column-id="FileSize" data-field="size" header-text="大小" renderer="FileSize"></f:render-field>
                    <f:render-field column-id="FileStatus" data-field="status" header-text="状态" renderer-function="renderFileStatus"></f:render-field>
                    <f:render-field column-id="FileActions" width="150" renderer-function="renderActions" enable-column-hide="false"></f:render-field>
                    <f:render-field column-id="FileSavedName" data-field="savedName" enable-column-hide="false" hidden="true"></f:render-field>
                </f:columns>
                <f:listeners>
                    <f:listener event="dataload" handler="onGridDataLoad"></f:listener>
                </f:listeners>
            </f:grid>
            <br />
            <br />
            注：由于第三方组件 WebUploader 限制，本示例支持的浏览器版本为：Chrome、Firefox、Safari、IE10+。

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/third-party/webuploader/webuploader.nolog.js}"></script>
            <script>
                function renderFileStatus(value) {
                    if (!value) {
                        return '尚未上传';
                    }
                    return value === 'uploaded' ? '上传成功' : value;
                }

                function renderActions(value, params) {
                    if (value === 'uploading') {
                        return '';
                    }
                    var html = '<a href="#" class="theuploadbutton">上传</a>';
                    if (params.rowValue.FileStatus === 'uploaded') {
                        html += '&nbsp;&nbsp;<a href="' + F.resolveUrl('/home/download?file=' + encodeURIComponent(params.rowValue.FileSavedName)) +
                            '" target="_blank" class="thedownloadbutton">下载</a>';
                        html += '&nbsp;&nbsp;<a href="#" class="thedeletebutton">删除</a>';
                    }
                    return html;
                }

                function initUploader(gridId, rowId) {
                    var grid = F(gridId);
                    var formData = {
                        owner: 'webuploader.webuploader_fixed#' + rowId
                    };
                    var csrfInput = $('#FineUICsrfToken');
                    if (csrfInput.length) {
                        formData[csrfInput.attr('name')] = csrfInput.val();
                    }
                    var uploader = WebUploader.create({
                        runtimeOrder: 'html5',
                        server: F.resolveUrl('/third-party/upload?handler=Process'),
                        pick: {
                            id: '#' + gridId + ' tr[data-rowid=' + rowId + '] a.theuploadbutton',
                            multiple: false
                        },
                        resize: false,
                        auto: true,
                        formData: formData,
                        fileSingleSizeLimit: 10 * 1024 * 1024,
                        fileNumLimit: 1
                    });

                    uploader.on('fileQueued', function(file) {
                        file.gridRowId = rowId;
                        grid.updateCellValue(rowId, {
                            FileName: file.name,
                            FileType: file.ext,
                            FileSize: file.size,
                            FileStatus: '等待上传',
                            FileActions: 'uploading'
                        }, true);
                    });
                    uploader.on('uploadProgress', function(file, percentage) {
                        var cell = grid.getCellEl(file.gridRowId, 'FileStatus').find('.f-grid-cell-text');
                        var bar = cell.find('.f-progressbar-value');
                        if (!bar.length) {
                            cell.html(
                                '<div class="f-progressbar f-widget-content" style="height:12px;"><div class="f-progressbar-value f-widget-header" style="width:0%"></div></div>'
                            );
                            bar = cell.find('.f-progressbar-value');
                        }
                        bar.css('width', percentage * 100 + '%');
                    });
                    uploader.on('uploadSuccess', function(file) {
                        grid.updateCellValue(file.gridRowId, 'FileStatus', '上传成功', true);
                    });
                    uploader.on('uploadError', function(file) {
                        grid.updateCellValue(file.gridRowId, 'FileStatus', '上传出错', true);
                    });
                    uploader.on('uploadComplete', function(file) {
                        uploader.removeFile(file, true);
                        F.customEvent('RebindGrid');
                    });
                    uploader.on('error', function(type, arg, file) {
                        if (type === 'F_EXCEED_SIZE') {
                            F.alert('文件[' + file.name + ']大小超出限制值（' + F.format.fileSize(arg) + '）');
                        } else if (type === 'Q_TYPE_DENIED') {
                            // 这个类型有两种成因：空文件、扩展名不在 accept 白名单里。
                            // 注意它派发时第二个参数就是 file 本身（不是大小上限），别照上面那条的签名去取。
                            F.alert(arg.size ?
                                '文件[' + arg.name + ']的类型不允许上传。' :
                                '文件[' + arg.name + ']是空文件，无法上传。');
                        }
                    });
                }

                function onGridDataLoad(event) {
                    var grid = this;
                    grid.el.find('a.theuploadbutton').each(function() {
                        var row = grid.getRowData($(this).closest('.f-grid-row'));
                        initUploader('Grid1', row.id);
                    });
                }

                F.ready(function() {
                    var grid = F.ui.Grid1;
                    // WebUploader 负责启动上传，这里只阻止链接占位地址改变页面位置。
                    grid.el.on('click', 'a.theuploadbutton', function(event) {
                        event.preventDefault();
                    });
                    grid.el.on('click', 'a.thedeletebutton', function(event) {
                        event.preventDefault();

                        var row = grid.getRowData($(this).closest('.f-grid-row'));
                        F.confirm({
                            message: '你确定要删除这个文件吗？',
                            target: '_top',
                            ok: function() {
                                F.customEvent('DeleteRow', row.id);
                            }
                        });
                    });
                });

            </script>
        </th:block>
    </body>

</html>
