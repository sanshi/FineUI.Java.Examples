<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>页面加载动画（CSS）</title>

        <style>
            body.f-body {
                padding: 10px;
            }

            ul.main {
                list-style-type: none;
                padding: 0;
                margin: 0;
            }

            ul.main li {
                display: inline-block;
                margin: 5px;
                border-width: 0;
                padding: 10px;
                border-radius: 10px;
                text-align: center;
                cursor: pointer;
            }

            ul.main li.f-state-hover,
            ul.main li.f-state-active {
                border-style: solid;
                border-width: 3px;
                padding: 7px;
            }

            ul.main li .title {
                text-align: center;
                font-size: 13px;
                margin-top: 10px;
            }

            ul.main li.f-state-active .title {
                font-weight: bold;
            }

            ul.main li>.f-widget-content {
                padding: 30px;
                display: inline-block;
                border-radius: 5px;
                box-shadow: 2px 2px 5px 0 rgba(0, 0, 0, 0.2);
            }

            ul.main li.f-state-hover>.f-widget-content,
            ul.main li.f-state-active>.f-widget-content {
                box-shadow: none;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">
            <ul class="main">
                <li>
                    <div class="f-widget-content">
                        <div class="f-loading-css f-loading-css-1"></div>
                    </div>
                    <div class="title">1</div>
                </li>
                <li>
                    <div class="f-widget-content">
                        <div class="f-loading-css f-loading-css-2"></div>
                    </div>
                    <div class="title">2</div>
                </li>
                <li>
                    <div class="f-widget-content">
                        <div class="f-loading-css f-loading-css-3"></div>
                    </div>
                    <div class="title">3</div>
                </li>
                <li>
                    <div class="f-widget-content">
                        <div class="f-loading-css f-loading-css-4"></div>
                    </div>
                    <div class="title">4</div>
                </li>
                <li>
                    <div class="f-widget-content">
                        <div class="f-loading-css f-loading-css-5"></div>
                    </div>
                    <div class="title">5</div>
                </li>
                <li>
                    <div class="f-widget-content">
                        <div class="f-loading-css f-loading-css-6"></div>
                    </div>
                    <div class="title">6</div>
                </li>
            </ul>
        </th:block>
        <th:block layout:fragment="script">
            <script>
                F.ready(function() {
                    // 选择加载动画：hover 高亮 + click 写 cookie 后刷新框架页
                    $('ul.main li').hover(function() {
                        $(this).addClass('f-state-hover');
                    }, function() {
                        $(this).removeClass('f-state-hover');
                    }).click(function() {
                        var loadingNumber = $(this).find('.title').text();

                        F.removeCookie('Loading');
                        F.cookie('Loading_CSS', loadingNumber, {
                            expires: 100 // 单位：天
                        });

                        top.window.location.reload();
                    });

                    // 初始化：按当前 Loading_CSS cookie 高亮
                    var loadingNumber = F.cookie('Loading_CSS');
                    if (!loadingNumber) {
                        loadingNumber = '1';
                    }
                    $('ul.main li').each(function() {
                        var cnode = $(this);
                        if (cnode.find('.title').text() === loadingNumber) {
                            cnode.addClass('f-state-active');
                        } else {
                            cnode.removeClass('f-state-active');
                        }
                    });
                });

            </script>
        </th:block>
    </body>

</html>
