<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 货币逐位分格显示</title>

        <style>
            .f-grid-cell-Salary .f-grid-cell-text {
                padding: 0;
            }

            .currency {
                border-collapse: separate;
                table-layout: fixed;
                width: 100%;
                border-spacing: 0px;
            }

            .currency td {
                border-right-width: 1px;
                border-right-style: solid;
                border-right-color: #ddd;
                text-align: center;
            }

            .currency td:last-child {
                border-right-color: transparent;
            }

            .currency td.separator {
                border-right-color: green;
            }

            .currency td.separator.lastone {
                border-right-color: red;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name"
                enable-column-lines="true">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                    <f:render-field header-text="工资" column-id="Salary" data-field="Salary" field-type="Float" width="200"
                        renderer-function="renderSalary"></f:render-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true"
                        min-width="150"></f:render-field>
                    <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup"></f:render-field>
                    <f:render-field header-text="注册日期" data-field="LogTime" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd"></f:render-field>
                </f:columns>
            </f:grid>
            <br />
            <f:button text="选中了哪些行" click-handler="onNotifySelectedRowsClick"></f:button>
        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                // 单元格总数（8, 11, 14）
                var CELL_COUNT = 11;

                function renderSalary(value) {
                    var result = '',
                        html = [];

                    var items = (value + '').split('.');
                    var integerPart = items[0];
                    var decimalPart = items[1];
                    result += integerPart;
                    if (decimalPart) {
                        result += decimalPart.charAt(0) || '0';
                        result += decimalPart.charAt(1) || '0';
                    } else {
                        result += '00';
                    }
                    var prefixCount = CELL_COUNT - result.length;
                    if (prefixCount > 0) {
                        for (var i = 0; i < prefixCount; i++) {
                            result = '_' + result;
                        }
                    }

                    html.push('<table class="currency"><tbody><tr>');
                    for (var i = 0; i < CELL_COUNT; i++) {
                        var cellCls = '';
                        if ((i + 1) % 3 === 0) {
                            cellCls = 'separator';

                            if (i + 1 + 3 > CELL_COUNT) {
                                cellCls += ' lastone';
                            }
                        }
                        var cellValue = result.charAt(i);
                        html.push(F.formatString('<td class="{0}">{1}</td>',
                            cellCls,
                            cellValue === '_' ? '&nbsp;' : cellValue));
                    }
                    html.push('</tr></tbody></table>');
                    return html.join('');
                }

            </script>
        </th:block>
    </body>

</html>
