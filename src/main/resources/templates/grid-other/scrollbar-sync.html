<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 两个表格滚动条同步</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:panel id="Panel1" layout="VBox" show-border="false" show-header="false" is-view-port="true" margin="10">
                <f:items>
                    <f:grid id="Grid1" box-flex="1" show-border="true" show-header="true" title="表格一" data-id-field="Id" data-text-field="Name">
                        <f:columns>
                            <f:row-number-field></f:row-number-field>
                            <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                            <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                            <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int"></f:render-field>
                            <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                            <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" width="150"></f:render-field>
                            <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup"></f:render-field>
                            <f:render-field header-text="GUID" data-field="GUID" width="300"></f:render-field>
                            <f:render-field header-text="爱好" data-field="Hobby" renderer-function="renderHobby" width="200"></f:render-field>
                            <f:render-field header-text="入学时间" data-field="EntranceDate"></f:render-field>
                            <f:render-field header-text="语文成绩" data-field="ChineseScore"></f:render-field>
                            <f:render-field header-text="数学成绩" data-field="MathScore"></f:render-field>
                            <f:render-field header-text="身高" data-field="ShenGao"></f:render-field>
                            <f:render-field header-text="体重" data-field="TiZhong"></f:render-field>
                            <f:render-field header-text="血压（低）" data-field="XueYaDi"></f:render-field>
                            <f:render-field header-text="血压（高）" data-field="XueYaGao"></f:render-field>
                            <f:render-field header-text="视力（左）" data-field="ShiLiZuo"></f:render-field>
                            <f:render-field header-text="视力（右）" data-field="ShiLiYou"></f:render-field>
                            <f:render-field header-text="矫正视力（左）" data-field="ShiLiZuoJiaoZhen" width="150"></f:render-field>
                            <f:render-field header-text="矫正视力（右）" data-field="ShiLiYouJiaoZhen" width="150"></f:render-field>
                        </f:columns>
                    </f:grid>
                    <f:grid id="Grid2" box-flex="1" show-border="true" show-header="true" title="表格二" data-id-field="Id" data-text-field="Name">
                        <f:columns>
                            <f:row-number-field></f:row-number-field>
                            <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                            <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                            <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int"></f:render-field>
                            <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                            <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" width="150"></f:render-field>
                            <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup"></f:render-field>
                            <f:render-field header-text="GUID" data-field="GUID" width="300"></f:render-field>
                            <f:render-field header-text="爱好" data-field="Hobby" renderer-function="renderHobby" width="200"></f:render-field>
                            <f:render-field header-text="入学时间" data-field="EntranceDate"></f:render-field>
                            <f:render-field header-text="语文成绩" data-field="ChineseScore"></f:render-field>
                            <f:render-field header-text="数学成绩" data-field="MathScore"></f:render-field>
                            <f:render-field header-text="身高" data-field="ShenGao"></f:render-field>
                            <f:render-field header-text="体重" data-field="TiZhong"></f:render-field>
                            <f:render-field header-text="血压（低）" data-field="XueYaDi"></f:render-field>
                            <f:render-field header-text="血压（高）" data-field="XueYaGao"></f:render-field>
                            <f:render-field header-text="视力（左）" data-field="ShiLiZuo"></f:render-field>
                            <f:render-field header-text="视力（右）" data-field="ShiLiYou"></f:render-field>
                            <f:render-field header-text="矫正视力（左）" data-field="ShiLiZuoJiaoZhen" width="150"></f:render-field>
                            <f:render-field header-text="矫正视力（右）" data-field="ShiLiYouJiaoZhen" width="150"></f:render-field>
                        </f:columns>
                    </f:grid>
                </f:items>
            </f:panel>
        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                function renderHobby(value, params) {
                    var result = [];

                    // Hobby：reading,basketball,travel,movie,music
                    // 爱好：读书, 篮球, 旅游, 电影, 音乐
                    var hobbies = value.split(',');

                    $.each(hobbies, function(index, hobby) {
                        if (hobby == "reading") {
                            result.push("读书");
                        } else if (hobby == "basketball") {
                            result.push("篮球");
                        } else if (hobby == "travel") {
                            result.push("旅游");
                        } else if (hobby == "movie") {
                            result.push("电影");
                        } else if (hobby == "music") {
                            result.push("音乐");
                        }
                    });

                    return result.join(',');
                }

                function syncGridScrollbar(el1, el2) {
                    el1.on('scroll', function() {
                        el2.scrollLeft(el1.scrollLeft());
                        el2.scrollTop(el1.scrollTop());
                    });

                    el2.on('scroll', function() {
                        el1.scrollLeft(el2.scrollLeft());
                        el1.scrollTop(el2.scrollTop());
                    });
                }

                F.ready(function() {

                    var grid1ScrollEl = F.ui.Grid1.getScrollEl();
                    var grid2ScrollEl = F.ui.Grid2.getScrollEl();

                    syncGridScrollbar(grid1ScrollEl, grid2ScrollEl);
                    syncGridScrollbar(grid2ScrollEl, grid1ScrollEl);

                });

            </script>
        </th:block>
    </body>

</html>
