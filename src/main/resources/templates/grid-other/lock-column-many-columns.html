<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 锁定列 + 多列表格</title>

        <style>
            .f-grid-row .f-grid-cell-text {
                white-space: normal;
                word-break: break-all;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格（23列，36行，行高不同）" data-id-field="Id" data-text-field="Name"
                is-view-port="true" allow-column-locking="true">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="标识" data-field="Id" enable-lock="true" locked="true"></f:render-field>
                    <f:render-field header-text="姓名" data-field="Name" enable-lock="true" locked="true"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender" enable-lock="true"
                        locked="true"></f:render-field>
                    <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int" enable-lock="true"></f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true" enable-lock="true"></f:render-check-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true" min-width="150"
                        enable-lock="true"></f:render-field>
                    <f:render-field header-text="个人简介" data-field="Desc" width="500" enable-lock="true"></f:render-field>
                    <f:render-field header-text="GUID" data-field="GUID" width="300" enable-lock="true"></f:render-field>
                    <f:render-field header-text="爱好" data-field="Hobby" renderer-function="renderHobby" width="200" enable-lock="true"></f:render-field>
                    <f:render-field header-text="入学时间" data-field="EntranceDate" enable-lock="true"></f:render-field>
                    <f:render-field header-text="语文成绩" data-field="ChineseScore" enable-lock="true"></f:render-field>
                    <f:render-field header-text="数学成绩" data-field="MathScore" enable-lock="true"></f:render-field>
                    <f:render-field header-text="身高" data-field="ShenGao" enable-lock="true"></f:render-field>
                    <f:render-field header-text="体重" data-field="TiZhong" enable-lock="true"></f:render-field>
                    <f:render-field header-text="血压（低）" data-field="XueYaDi" enable-lock="true"></f:render-field>
                    <f:render-field header-text="血压（高）" data-field="XueYaGao" enable-lock="true"></f:render-field>
                    <f:render-field header-text="视力（左）" data-field="ShiLiZuo" enable-lock="true"></f:render-field>
                    <f:render-field header-text="视力（右）" data-field="ShiLiYou" enable-lock="true"></f:render-field>
                    <f:render-field header-text="矫正视力（左）" data-field="ShiLiZuoJiaoZhen" width="150" enable-lock="true"></f:render-field>
                    <f:render-field header-text="矫正视力（右）" data-field="ShiLiYouJiaoZhen" width="150" enable-lock="true"></f:render-field>
                </f:columns>
            </f:grid>
        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                function renderHobby(value, params) {
                    var result = [];

                    // Hobby：reading,basketball,travel,movie,music
                    // 爱好：读书, 篮球, 旅游, 电影, 音乐
                    var hobbies = value.split(',');

                    $.each(hobbies, function(index, hobby) {
                        if (hobby == "reading") {
                            result.push("读书");
                        } else if (hobby == "basketball") {
                            result.push("篮球");
                        } else if (hobby == "travel") {
                            result.push("旅游");
                        } else if (hobby == "movie") {
                            result.push("电影");
                        } else if (hobby == "music") {
                            result.push("音乐");
                        }
                    });

                    return result.join(',');
                }

            </script>
        </th:block>
    </body>

</html>
