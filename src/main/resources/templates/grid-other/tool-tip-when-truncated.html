<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 单元格提示（仅截断时显示）</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                    <f:render-field header-text="所学专业（仅截断时显示）" data-field="Major" width="140" show-tool-tip="true"
                        show-tooltip-when-truncated="true"></f:render-field>
                    <f:render-field header-text="所学专业（永远显示）" data-field="Major" width="140" show-tool-tip="true"></f:render-field>
                </f:columns>
            </f:grid>
            <br />
            <div>
                <b>两列的区别（把鼠标依次移到两列的各行上对比）：</b>
                <ul>
                    <li><b>所学专业（仅截断时显示）</b>：<code>show-tool-tip="true" show-tooltip-when-truncated="true"</code>。只有当专业名过长、被列宽截断出现省略号时才弹出提示；短名鼠标悬停<b>不弹</b>提示。
                    </li>
                    <li><b>所学专业（永远显示）</b>：<code>show-tool-tip="true"</code>。无论内容长短，鼠标悬停<b>都会</b>弹出完整内容的提示——这是默认行为。</li>
                </ul>
            </div>
        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
        </th:block>
    </body>

</html>
