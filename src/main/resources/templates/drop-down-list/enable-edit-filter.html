<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · EnableEditFilter</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" enable-collapse="false" show-border="true" title="下拉列表（可编辑，强制选择）"
                show-header="true">
                <f:items>
                    <f:drop-down-list id="DropDownList1" enable-edit="true" filter-function="filterDropDownList1">
                        <f:list-item text="可选项1" value="Value1" selected="true"></f:list-item>
                        <f:list-item text="可选项2（不可选择）" value="Value2" enable-select="false"></f:list-item>
                        <f:list-item text="可选项3（不可选择）" value="Value3" enable-select="false"></f:list-item>
                        <f:list-item text="可选项4" value="Value4"></f:list-item>
                        <f:list-item text="可选项5" value="Value5"></f:list-item>
                        <f:list-item text="可选项6" value="Value6"></f:list-item>
                        <f:list-item text="选择项7" value="Value7"></f:list-item>
                        <f:list-item text="选择项8" value="Value8"></f:list-item>
                        <f:list-item text="选择项9" value="Value9"></f:list-item>
                        <f:list-item text="普通型1 < L > 1.5" value="普通型1 < L > 1.5"></f:list-item>
                    </f:drop-down-list>
                    <f:button id="btnSelectItem6" text="选中[可选项6]" css-class="marginr" on-click="btnSelectItem6_Click"></f:button>
                    <f:button id="btnGetSelection" text="获取此下拉列表的选中项" on-click="btnGetSelection_Click"></f:button>
                </f:items>
            </f:simple-form>
            <br />
            <f:label id="labResult" encode-text="false"></f:label>
            <br />
            注：用户输入文本时，会从第一个字符开始匹配（尝试输入字符：选）。

        </th:block>
        <th:block layout:fragment="script">
            <script>
                function filterDropDownList1(filterText, listItemText) {
                    // 返回 false 则排除当前列表项
                    if (!F.startsWith(filterText.toLowerCase(), listItemText.toLowerCase())) {
                        return false;
                    }
                }

            </script>
        </th:block>
    </body>

</html>
