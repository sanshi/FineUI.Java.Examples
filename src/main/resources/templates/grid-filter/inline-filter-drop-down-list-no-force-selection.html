<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 内联表头过滤列表多选不强制选择</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name" allow-filters="true"
                inline-filters="true" on-filter-changed="Grid1_FilterChanged">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                    <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int"></f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                    <f:render-field column-id="Major" header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true"
                        min-width="150" enable-filter="true">
                        <f:filter>
                            <f:field>
                                <f:drop-down-list id="DropDownList1" enable-edit="true" auto-select-first-item="false" enable-multi-select="true"
                                    force-selection="false">
                                    <f:list-item text="材料科学与工程系" value="材料科学与工程系"></f:list-item>
                                    <f:list-item text="化学系" value="化学系"></f:list-item>
                                    <f:list-item text="物理系" value="物理系"></f:list-item>
                                    <f:list-item text="数学系" value="数学系"></f:list-item>
                                    <f:list-item text="自动化系" value="自动化系"></f:list-item>
                                </f:drop-down-list>
                            </f:field>
                        </f:filter>
                    </f:render-field>
                    <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup"></f:render-field>
                    <f:render-field header-text="注册日期" data-field="LogTime" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd"></f:render-field>
                </f:columns>
            </f:grid>
            <br />
            <br />

            <f:label id="labResult" encode-text="false"></f:label>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
        </th:block>
    </body>

</html>
