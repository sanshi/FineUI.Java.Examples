<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 表头过滤数字日期</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name" allow-filters="true"
                on-filter-changed="Grid1_FilterChanged">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                    <f:render-field column-id="EntranceYear" header-text="入学年份" data-field="EntranceYear" field-type="Int" enable-filter="true">
                        <f:filter enable-multi-conditions="true">
                            <f:operator>
                                <f:drop-down-list>
                                    <f:list-item text="大于" value="greater" selected="true"></f:list-item>
                                    <f:list-item text="小于" value="less"></f:list-item>
                                    <f:list-item text="等于" value="equal"></f:list-item>
                                </f:drop-down-list>
                            </f:operator>
                            <f:field>
                                <f:number-box no-decimal="true" no-negative="true"></f:number-box>
                            </f:field>
                        </f:filter>
                    </f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true"
                        min-width="150"></f:render-field>
                    <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup"></f:render-field>
                    <f:render-field column-id="LogTime" header-text="注册日期" data-field="LogTime" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd"
                        enable-filter="true">
                        <f:filter enable-multi-conditions="true">
                            <f:operator>
                                <f:drop-down-list>
                                    <f:list-item text="大于" value="greater" selected="true"></f:list-item>
                                    <f:list-item text="小于" value="less"></f:list-item>
                                    <f:list-item text="等于" value="equal"></f:list-item>
                                </f:drop-down-list>
                            </f:operator>
                            <f:field>
                                <f:date-picker date-format-string="yyyy/MM/dd"></f:date-picker>
                            </f:field>
                        </f:filter>
                    </f:render-field>
                </f:columns>
            </f:grid>
            <br />
            <br />

            <f:label id="labResult" encode-text="false"></f:label>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
        </th:block>
    </body>

</html>
