<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · DatePickerIndependentRangePanels</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" title="简单表单">
                <f:items>
                    <f:date-picker id="DatePicker1" required="true" date-format-string="yyyy/MM/dd" label="日期范围" empty-text="请选择日期范围" show-red-star="true"
                        display-type="DayRange" independent-range-panels="true"></f:date-picker>
                    <f:date-picker id="DatePicker2" required="true" date-format-string="yyyy/MM" label="月份范围" empty-text="请选择月份范围" show-red-star="true"
                        display-type="MonthRange" independent-range-panels="true"></f:date-picker>
                    <f:date-picker id="DatePicker3" required="true" date-format-string="yyyy" label="年份范围" empty-text="请选择年份范围" show-red-star="true"
                        display-type="YearRange" independent-range-panels="true"></f:date-picker>
                    <f:button id="btnSubmit" validate-forms="SimpleForm1" text="提交表单" on-click="btnSubmit_Click"></f:button>
                </f:items>
            </f:simple-form>
            <br />
            <f:label id="labResult" encode-text="false" show-label="false"></f:label>
            <br />
            <div style="margin-top:15px;color:#666;line-height:1.8;">
                说明：设置 IndependentRangePanels=true 开启“范围面板独立切换”。范围选择时左右两个面板可各自独立切换年份/月份，互不联动，便于快速定位跨度较大的起止日期区间。
            </div>

        </th:block>
    </body>

</html>
