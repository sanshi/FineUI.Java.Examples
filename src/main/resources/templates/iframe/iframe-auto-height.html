<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · IFrame 面板高度自适应</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:button id="Button1" css-class="marginr" text="按钮页面" click-handler="onButtonClick"></f:button>
            <f:button id="Button2" css-class="marginr" text="分组按钮页面" click-handler="onButtonClick"></f:button>
            <f:button id="Button6" css-class="marginr" text="垂直分组按钮页面" click-handler="onButtonClick"></f:button>
            <br />
            <br />
            <f:panel id="Panel1" is-fluid="true" show-border="true" enable-iframe="true" iframe-url="/button/button" show-header="true"
                title="面板一（面板高度随IFrame的高度自适应）">
                <f:listeners>
                    <f:listener event="iframeload" handler="onIFrameLoad"></f:listener>
                </f:listeners>
            </f:panel>

            <br />
            <br />
            注：本示例不适合加载外部页面！
            <br />
            由于存在<a href="https://en.wikipedia.org/wiki/Same_origin_policy">跨域限制（Same-origin policy）</a>，在IFrame中加载外部页面时，无法访问到IFrame页面的document属性！

        </th:block>
        <th:block layout:fragment="script">
            <script>
                function onButtonClick(event) {
                    var me = this;

                    var panel1 = F.ui.Panel1;

                    // 重置面板一的高度
                    panel1.setHeight('auto');

                    // 按按钮选择 Java 页面路由，并在当前站点路径下打开。
                    var iframeUrls = {
                        Button1: '/button/button',
                        Button2: '/button/button-group',
                        Button6: '/button/button-group-vertical'
                    };
                    panel1.setIFrameUrl(F.resolveUrl(iframeUrls[me.id]));
                }


                function onIFrameLoad(event) {
                    var me = this;

                    // 面板一的标题栏高度
                    var panelHeaderHeight = me.el.outerHeight() - me.bodyEl.outerHeight();

                    // IFrame页面的实际高度
                    var iframeDoc = $(me.getIFrameWindow().document);
                    var iframePageHeight = iframeDoc.height();

                    // 如果页面控件高度自适应（IsViewPort=true）
                    if (iframeDoc.find('body.f-viewport').length) {
                        var panelBodyEl = iframeDoc.find('.f-panel-viewport .f-panel-body');
                        iframePageHeight += panelBodyEl[0].scrollHeight - panelBodyEl.outerHeight();
                    }

                    // 设置面板一的新高度
                    me.setHeight(iframePageHeight + panelHeaderHeight);
                }

            </script>
        </th:block>
    </body>

</html>
