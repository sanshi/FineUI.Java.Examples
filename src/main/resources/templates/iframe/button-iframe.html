<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 按钮弹出 IFrame 窗体</title>
        <!--/* 声明本页引用的其它源文件（分号分隔，每项写成 前缀:值，前缀有 route/template/class/res 四种，见 SourceFiles）：首页"查看源代码"把它们也渲染为选项卡 */-->
        <meta name="sourcefiles" content="route:grid/iframe-window" />
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:button id="Button1" text="在本页面弹出IFrame窗体" click-handler="onOpenWindow1Click"></f:button>
            <br />
            <br />
            <f:button id="Button2" text="在父页面弹出IFrame窗体" click-handler="onOpenWindow2Click"></f:button>
            <br />
            <br />
            <f:label id="labResult" encode-text="false" css-style="font-weight:bold;"></f:label>
            <br />

            <br />
            <br />
            注：
            <ul>
                <li>
                    点击窗体一的右上角关闭图标时，只是简单的隐藏窗体；
                </li>
                <li>
                    点击窗体二的右上角关闭图标时，会触发 OnClose 事件（CloseAction=HidePostBack）。
                </li>
            </ul>

            <f:window id="Window1" icon-url="/res/images/16/10.png" hidden="true" window-position="Center" is-modal="true" title="窗体一" enable-maximize="true"
                enable-resize="true" target="Self" enable-iframe="true" height="550" width="850" on-close="Window1_Close"></f:window>
            <f:window id="Window2" icon-url="/res/images/16/11.png" hidden="true" is-modal="true" target="Parent" enable-maximize="true" enable-resize="true"
                on-close="Window2_Close" title="窗体二" close-action="HidePostBack" enable-iframe="true" height="550" width="850"></f:window>

        </th:block>
        <th:block layout:fragment="script">
            <script>
                function onOpenWindow1Click(event) {
                    F.ui.Window1.show(F.resolveUrl('/grid/iframe-window'), '弹出窗口一');
                }

                function onOpenWindow2Click(event) {
                    F.ui.Window2.show(F.resolveUrl('/grid/iframe-window'), '弹出窗口二');
                }

            </script>
        </th:block>
    </body>

</html>
