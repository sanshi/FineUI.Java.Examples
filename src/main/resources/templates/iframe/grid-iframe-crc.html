<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 客户端渲染操作列打开 IFrame 窗体</title>
        <!--/* 声明本页引用的其它源文件（分号分隔，每项写成 前缀:值，前缀有 route/template/class/res 四种，见 SourceFiles）：首页"查看源代码"把它们也渲染为选项卡 */-->
        <meta name="sourcefiles" content="route:grid/iframe-window" />
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="Panel7" body-padding="20" title="Panel" show-border="false" show-header="false" is-view-port="true" layout="VBox"
                box-config-align="Stretch">
                <f:items>
                    <f:form id="Form5" show-border="true" body-padding="10" remove-last-fields-margin="true" show-header="false">
                        <f:rows>
                            <f:form-row>
                                <f:items>
                                    <f:twin-trigger-box id="ttbSearch" empty-text="输入要搜索的关键词" show-label="false" show-trigger1="false" trigger1-icon="Clear"
                                        trigger2-icon="Search" on-trigger1-click="ttbSearch_Trigger1Click"
                                        on-trigger2-click="ttbSearch_Trigger2Click"></f:twin-trigger-box>
                                    <f:drop-down-list id="DropDownList1" show-label="false" on-selected-index-changed="DropDownList1_SelectedIndexChanged">
                                        <f:list-items>
                                            <f:list-item text="过滤条件一" value="filter1"></f:list-item>
                                            <f:list-item text="过滤条件二" value="filter2"></f:list-item>
                                            <f:list-item text="过滤条件三" value="filter3"></f:list-item>
                                        </f:list-items>
                                    </f:drop-down-list>
                                </f:items>
                            </f:form-row>
                        </f:rows>
                    </f:form>
                    <f:grid id="Grid1" title="Grid1" page-size="10" show-border="true" box-flex="1" allow-paging="true" is-database-paging="false"
                        show-header="false" enable-check-box-select="true" data-id-field="Id" data-text-field="Name" on-sort="Grid1_Sort">
                        <f:toolbars>
                            <f:toolbar id="Toolbar2">
                                <f:items>
                                    <f:button id="btnPopupWindow" text="弹出对话框" click-handler="onPopupWindowClick">
                                    </f:button>
                                    <f:toolbar-separator id="ToolbarSeparator1"></f:toolbar-separator>
                                    <f:button id="btnCheckSelection" text="检查选中项状态" click-handler="onCheckSelectionClick"></f:button>
                                    <f:toolbar-separator id="ToolbarSeparator2"></f:toolbar-separator>
                                    <f:button id="btnConfirmButton" text="删除选中行" click-handler="onConfirmButtonClick">
                                    </f:button>
                                </f:items>
                            </f:toolbar>
                        </f:toolbars>
                        <f:columns>
                            <f:row-number-field></f:row-number-field>
                            <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                            <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                            <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int"></f:render-field>
                            <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                            <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true"
                                min-width="150"></f:render-field>
                            <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup"></f:render-field>
                            <f:render-field header-text="" enable-header-menu="false" renderer-function="renderActionField"></f:render-field>
                        </f:columns>
                    </f:grid>
                </f:items>
            </f:panel>

            <f:window id="Window1" title="弹出窗体" hidden="true" enable-iframe="true" enable-maximize="true" target="Top" enable-resize="true" is-modal="true"
                width="850" height="500" close-action="HidePostBack" on-close="Window1_Close"></f:window>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>

            <script>
                function renderActionField(value, params) {
                    return '<a href="#" class="editfield"><img class="f-grid-cell-icon" src="' + F.resolveUrl('/res/icon/pencil.png') + '"></a>' +
                        '&nbsp;&nbsp;&nbsp;&nbsp;<a href="#" class="deletefield"><img class="f-grid-cell-icon" src="' + F.resolveUrl(
                            '/res/icon/delete.png') + '"></a>';
                }

                // 打开窗体
                function openWindow(rowData) {

                    // Grid/IFrameWindow?id=104&name=刘国
                    var iframeWindowUrl = F.resolveUrl('/grid/iframe-window');
                    var iframeUrl = iframeWindowUrl + '?id=' + rowData.id + '&name=' + encodeURIComponent(rowData.text);

                    // 显示窗体
                    F.ui.Window1.show(iframeUrl, '详细信息 - ' + rowData.text);
                }

                F.ready(function() {

                    var grid = F.ui.Grid1;

                    // 点击表格行中的编辑按钮
                    grid.el.on('click', 'a.editfield', function(event) {
                        event.preventDefault();

                        var rowEl = $(this).closest('.f-grid-row');
                        var rowData = grid.getRowData(rowEl);

                        openWindow(rowData);
                    });

                    // 点击表格行中的删除按钮
                    grid.el.on('click', 'a.deletefield', function(event) {
                        event.preventDefault();

                        F.alert('尚未实现！');
                    });

                });

                function onPopupWindowClick(event) {
                    F.ui.Window1.show(F.resolveUrl('/grid/iframe-window'));
                    return false;
                }

                function onCheckSelectionClick(event) {
                    if (!F.ui.Grid1.hasSelection()) {
                        F.alert('请至少选择一项！');
                        return false;
                    }
                }

                function onConfirmButtonClick(event) {
                    if (!F.ui.Grid1.hasSelection()) {
                        F.alert('请至少选择一项！');
                        return false;
                    }
                    F.confirm({
                        message: '你确定要删除选中的记录吗？'
                    });
                    return false;
                }

            </script>
        </th:block>
    </body>

</html>
