<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · CheckBoxListDisabled</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:simple-form id="SimpleForm1" is-fluid="true" label-width="160" body-padding="10" show-border="true" show-header="true" title="简单表单">
                <f:items>
                    <f:check-box-list id="CheckBoxList1" label="列表一">
                        <f:check-item text="可选项 1" value="value1" enabled="false"></f:check-item>
                        <f:check-item text="可选项 2" value="value2" selected="true"></f:check-item>
                        <f:check-item text="可选项 3" value="value3" selected="true"></f:check-item>
                    </f:check-box-list>
                    <f:panel css-class="f-field" show-border="false" show-header="false">
                        <f:items>
                            <f:button id="btnServerSetSelectedValue" css-class="marginr" text="选中上面列表中的第一项和第三项" on-click="btnServerSetSelectedValue_Click">
                            </f:button>
                            <f:button id="btnServerGetSelectedValue" css-class="marginr" text="获取上面列表的选中项" on-click="btnServerGetSelectedValue_Click">
                            </f:button>
                            <f:button id="btnClientGetSelectedValue" text="获取上面列表的选中项（JavaScript 脚本）" click-handler="onAlertSelectedValueClick"></f:button>
                        </f:items>
                    </f:panel>
                    <f:label></f:label>
                    <f:check-box-list id="CheckBoxList2" label="列表二（一列）" column-number="1"></f:check-box-list>
                </f:items>
                <f:toolbars>
                    <f:toolbar position="Bottom" toolbar-align="Right">
                        <f:items>
                            <f:button id="btnSubmit" validate-forms="SimpleForm1" text="提交表单" on-click="btnSubmit_Click"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:simple-form>

        </th:block>
        <th:block layout:fragment="script">
            <script>
                function onAlertSelectedValueClick(event) {
                    var list1 = F.ui.CheckBoxList1;

                    var selectedValues = list1.getValue();
                    if (selectedValues.length) {
                        F.alert("列表一的选中项：" + selectedValues.join(','));
                    } else {
                        F.alert("列表一没有选中项！");
                    }
                }

            </script>
        </th:block>
    </body>

</html>
