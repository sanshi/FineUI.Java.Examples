<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · NumberBox 小数精度</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" label-align="Top" enable-collapse="false" title="简单表单" label-width="120">
                <f:items>
                    <f:number-box id="NumberBox1" empty-text="精度为 2，比如 0.35" label="0 到 1 之间的小数" value="0.356" max-value="1" min-value="0" no-decimal="false"
                        no-negative="true" decimal-precision="2" required="true" show-red-star="true" increment="0.01" trim-end-zero="false"></f:number-box>
                    <f:button id="btnSubmit" validate-forms="SimpleForm1" text="提交表单" on-click="btnSubmit_Click"></f:button>
                </f:items>
                <f:toolbars>
                    <f:toolbar position="Top">
                        <f:button id="Button1" text="修改精度为 1" on-click="Button1_Click"></f:button>
                        <f:button id="Button2" text="修改精度为 2" on-click="Button2_Click"></f:button>
                        <f:button id="Button3" text="修改精度为 3" on-click="Button3_Click"></f:button>
                    </f:toolbar>
                </f:toolbars>
            </f:simple-form>
            <br />
            注：为数字输入框设置了 TrimEndZero=false，所以不会去掉末尾的零（比如精度为 3 时，会显示 0.360，而不是 0.36）。

        </th:block>
    </body>

</html>
