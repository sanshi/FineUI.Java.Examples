<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · TextBoxQtip</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" enable-collapse="false" title="登录表单" show-header="true" label-align="Right">
                <f:items>
                    <f:text-box id="tbxUserName" label="用户名" empty-text="请输入用户名" required="true" show-red-star="true">
                        <f:attributes>
                            <f:attribute key="data-qtitle" value="用户名"></f:attribute>
                            <f:attribute key="data-qtip" value="通过Attributes属性设置的提示信息，鼠标移动到标签和输入框都会提示"></f:attribute>
                        </f:attributes>
                    </f:text-box>
                    <f:text-box id="tbxPassword" label="密码" empty-text="请输入密码" text-mode="Password" required="true" show-red-star="true"></f:text-box>
                    <f:button id="btnSubmit" css-class="marginr" on-click="btnSubmit_Click" validate-forms="SimpleForm1" text="登录"></f:button>
                    <f:button id="btnReset" click-handler="onResetClick" text="重置"></f:button>
                </f:items>
            </f:simple-form>
            <br />
            <f:label id="labResult" encode-text="false" show-label="false"></f:label>
            <br>
            <ul>
                <li>【用户名】的提示信息，在鼠标移动到标签和输入框时都会显示</li>
                <li>【密码】的提示信息，仅在鼠标移动到标签时才会显示</li>
            </ul>

        </th:block>
        <th:block layout:fragment="script">
            <script>
                F.ready(function() {
                    F.ui.tbxPassword.el.find('.f-field-fieldlabel').attr({
                        'data-qtitle': '密码',
                        'data-qtip': '通过 JavaScript 设置的提示信息，鼠标移动到标签时才会提示'
                    });
                });

                function onResetClick(event) {
                    F.ui.SimpleForm1.reset();
                }

            </script>
        </th:block>
    </body>

</html>
