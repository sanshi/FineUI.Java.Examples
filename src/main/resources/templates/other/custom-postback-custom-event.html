<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 自定义事件</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" enable-collapse="false" title="简单表单">
                <f:items>
                    <f:text-box id="TextBox1" show-label="false" empty-text="输入一些文字并按 ENTER 键">
                        <f:listeners>
                            <f:listener event="enter" handler="onTextBoxEnter"></f:listener>
                        </f:listeners>
                    </f:text-box>
                    <f:text-box id="TextBox2" show-label="false"></f:text-box>
                </f:items>
            </f:simple-form>
        </th:block>

        <!--/* 页面专属脚本注入母版 script 槽（输出在 <f:scripts> 之后，此时 FineUI.js 已就绪）。 */-->
        <th:block layout:fragment="script">
            <script>
                function onTextBoxEnter(event) {
                    // 触发后台自定义事件（空 target + 空 handler → 服务端 Page_CustomEvent）
                    F.customEvent('TextBox1_ENTER');
                }

            </script>
        </th:block>
    </body>

</html>
