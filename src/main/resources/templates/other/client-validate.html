<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 客户端验证</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" enable-collapse="false" title="用户注册表单">
                <f:items>
                    <f:text-box id="tbxUserName" label="用户名" required="true" next-focus-control="tbxPassword" show-red-star="true" text="admin"></f:text-box>
                    <f:text-box id="tbxPassword" label="密码" required="true" show-red-star="true" next-focus-control="btnRegister"
                        text-mode="Password"></f:text-box>
                    <f:button id="btnRegister" text="注册" validate-forms="SimpleForm1" validate-target="Top" on-click="btnRegister_Click"
                        click-handler="onClientValidateClick"></f:button>
                </f:items>
            </f:simple-form>
            <br />
            <br />
            注：
            <ul>
                <li>
                    提交表单时客户端验证[密码]必须为 6 个字符，否则标记为无效。
                </li>
            </ul>
        </th:block>

        <th:block layout:fragment="script">
            <script>
                // 客户端验证：密码必须正好 6 个字符，否则返回 false 阻止服务端回发
                function onClientValidateClick(event) {
                    var tbxPassword = F.ui.tbxPassword;
                    var value = $.trim(tbxPassword.getValue());
                    if (value.length === 6) {
                        return true;
                    } else {
                        F.alert('密码必须为 6 个字符！');
                        tbxPassword.markInvalid();
                        return false;
                    }
                }

            </script>
        </th:block>
    </body>

</html>
