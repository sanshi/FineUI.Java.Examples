<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 拦截服务器端重定向（同步确认）</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:button id="btnRegisterHook" text="1. 注册跳转拦截函数" click-handler="onRegisterHookClick"></f:button>
            <br />
            <br />
            <f:button id="Button2" text="2. 点击回发（模拟 Forms Authentication 超时）" on-click="Button2_Click"></f:button>
            <br />
            <br />
            请尝试如下两种不同操作步骤：
            <br />
            <br />
            <div>操作一：</div>
            <ol>
                <li>刷新页面</li>
                <li>点击按钮2 -&gt; 直接跳转到首页</li>
            </ol>
            <br />
            <div>操作二：</div>
            <ol>
                <li>刷新页面</li>
                <li>点击按钮1</li>
                <li>点击按钮2 -&gt; 首先弹出确认框，点击确认后才跳转到首页；如果点击取消，则留在本页</li>
            </ol>
        </th:block>

        <th:block layout:fragment="script">
            <script>
                function onRegisterHookClick(event) {
                    F.beforeAjaxSuccess(function(data, textStatus, xhr, command) {
                        // 本例用服务端重定向模拟登录超时，不需要解析响应脚本文本。
                        if (command && command.type === 'page.redirect') {
                            if (!window.confirm('登陆超时，是否跳转到首页？')) {
                                // 继续留在当前页面
                                // 显式返回 false，阻止框架自动跳转。
                                return false;
                            }
                        }
                    });

                    F.alert('拦截函数注册成功！');
                }

            </script>
        </th:block>
    </body>

</html>
