<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 服务器错误（自行拦截）</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:button id="Button5" text="服务器异常（500）" on-click="Button5_Click"></f:button>
        </th:block>

        <th:block layout:fragment="script">
            <script>
                F.beforeAjaxError(function(data, textStatus, xhr) {
                    // 错误正文可能是 HTML、JSON 或空文本，示例只展示稳定的状态信息。
                    var errorStatus = xhr.status ? 'HTTP ' + xhr.status : textStatus;
                    F.alert({
                        message: '这是自定义错误处理！服务器返回的状态：' + errorStatus,
                        messageIcon: 'error'
                    });

                    // 需要显式的返回 false，来阻止默认的错误处理
                    return false;
                });

            </script>
        </th:block>
    </body>

</html>
