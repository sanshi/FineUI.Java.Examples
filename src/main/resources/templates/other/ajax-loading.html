<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 页面回发提示</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:button id="Button1" text="不显示提示信息" on-click="Button1_Click"></f:button>
            <br />
            <br />
            <f:button id="Button2" text="使用PageManager定义的提示信息" on-click="Button1_Click"></f:button>
            <!--/* 注：Java 端 PageManager 全局提示不输出，此按钮与 Button1/Button3 一样回发期间无提示 */-->
            <br />
            <br />
            <f:button id="Button3" text="默认风格提示信息" on-click="Button1_Click"></f:button>
            <br />
            <br />
            <f:button id="Button4" text="Mask风格提示信息" on-click="Button1_Click" ajax-loading-type="mask"></f:button>
            <br />
            <br />
            <f:button id="Button5" text="Mask风格提示信息（显示提示文本）" on-click="Button1_Click" ajax-loading-type="mask" show-ajax-loading-mask-text="true"></f:button>
            <br />
            <br />
            <f:button id="Button6" text="Mask风格提示信息（自定义提示文本）" on-click="Button1_Click" ajax-loading-type="mask" show-ajax-loading-mask-text="true"
                ajax-loading-mask-text="这是自定义提示文本"></f:button>
            <br />
            <br />
            注：
            <ul>
                <li>为了观察Ajax提示信息，所有按钮动作在后台都会睡眠1秒钟。</li>
                <li>FineUI.Java 目前实现 Mask 风格的回发遮罩（按钮级 ajax-loading-type="mask" 及
                    show-ajax-loading-mask-text / ajax-loading-mask-text）；default 风格提示条与 PageManager
                    全局提示暂不输出，故 Button1-3 在回发期间不显示提示。</li>
            </ul>
        </th:block>
    </body>

</html>
