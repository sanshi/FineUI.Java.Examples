<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 行分组（数据库分页排序 + 当前页合计）</title>

        <style>
            .f-grid-rowgroup-summary .f-grid-cell-Major .f-grid-cell-text {
                text-align: right;
            }

            .f-grid-rowgroup-summary .f-grid-cell-text {
                font-style: italic;
            }

            .f-grid-row-summary .f-grid-cell-Major .f-grid-cell-text {
                text-align: right;
            }

            .f-grid-row-summary .f-grid-cell-text {
                font-weight: bold;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:grid id="Grid1" is-fluid="true" height="500" show-border="true" show-header="true" title="表格" enable-check-box-select="false" data-id-field="Id"
                data-text-field="Name" allow-paging="true" page-size="10" is-database-paging="true" on-page-index-changed="Grid1_PageIndexChanged"
                allow-sorting="true" sort-field="Name" sort-direction="ASC" on-sort="Grid1_Sort" enable-row-group="true" data-row-group-field="EntranceYear"
                row-group-summary="true" enable-summary="true" summary-position="Bottom">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name" sort-field="Name"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" sort-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                    <f:render-field header-text="入学年份" data-field="EntranceYear" sort-field="EntranceYear" field-type="Int"></f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" sort-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                    <f:render-field header-text="所学专业" data-field="Major" column-id="Major" renderer-function="renderMajor" expand-unused-space="true"
                        min-width="150" row-group-summary-text="平均（分组）：" summary-text="平均（汇总）："></f:render-field>
                    <f:render-field header-text="语文成绩" data-field="ChineseScore" column-id="ChineseScore" field-type="Int" row-group-summary-type="Avg"
                        summary-type="Avg"></f:render-field>
                    <f:render-field header-text="数学成绩" data-field="MathScore" column-id="MathScore" field-type="Int" row-group-summary-type="Avg"
                        summary-type="Avg"></f:render-field>
                </f:columns>
            </f:grid>
            <br />
            <f:button text="选中了哪些行" click-handler="onNotifySelectedRowsClick"></f:button>
        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
        </th:block>
    </body>

</html>
