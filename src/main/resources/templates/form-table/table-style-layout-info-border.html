<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · TableStyleLayoutInfoBorder</title>


        <link th:href="@{/res/css/tablestyle_noborder.css}" rel="stylesheet" />
        <style>
            .userphoto {
                text-align: center;
            }

            .uploadbutton .f-field-body-cell-rightpart {
                padding: 5px 20px !important;
            }

            .uploadbutton .f-btn {
                width: 100%;
            }

        </style>

    </head>

    <body>

        <th:block layout:fragment="body">

            <f:window id="Window1" title="信息录入" is-modal="false" enable-close="false" enable-resize="true" width="850" body-padding="0" auto-scroll="true">
                <f:items>
                    <f:form id="Form1" label-align="Right" red-star-position="BeforeText" label-width="90" show-border="false" show-header="false"
                        enable-table-style="true" message-target="Qtip">
                        <f:items>
                            <f:panel id="Panel2" show-border="false" show-header="false" layout="HBox" box-config-align="StretchMax">
                                <f:items>
                                    <f:panel id="Panel1" title="面板1" box-flex="5" show-border="false" show-header="false">
                                        <f:items>
                                            <f:text-box id="tbxName" label="会员姓名" show-red-star="true" required="true"></f:text-box>
                                            <f:drop-down-list id="ddlSex" label="性别" show-red-star="true" required="true" compare-message="性别不能为空！">
                                                <f:items>
                                                    <f:list-item text="男" value="男" selected="true"></f:list-item>
                                                    <f:list-item text="女" value="女"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                            <f:date-picker id="dpBirthDay" label="出生日期" empty-text="请选择日期" enable-edit="false" show-red-star="true"
                                                required="true"></f:date-picker>
                                            <f:text-box id="tbxAge" label="年龄" required="true" show-red-star="true" compare-message="年龄不能为空！"></f:text-box>
                                            <f:drop-down-list id="ddlMarriage" label="婚姻状况" show-red-star="true" required="true">
                                                <f:items>
                                                    <f:list-item text="未婚" value="0" selected="true"></f:list-item>
                                                    <f:list-item text="已婚" value="1"></f:list-item>
                                                    <f:list-item text="离异" value="2"></f:list-item>
                                                    <f:list-item text="丧偶" value="3"></f:list-item>
                                                    <f:list-item text="未说明" value="4"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                            <f:drop-down-list id="ddlNation" label="民族" show-red-star="true" required="true">
                                                <f:items>
                                                    <f:list-item text="汉族" value="汉族" selected="true"></f:list-item>
                                                    <f:list-item text="回族" value="回族"></f:list-item>
                                                    <f:list-item text="壮族" value="壮族"></f:list-item>
                                                    <f:list-item text="回族" value="回族"></f:list-item>
                                                    <f:list-item text="苗族" value="苗族"></f:list-item>
                                                    <f:list-item text="维吾尔族" value="维吾尔族"></f:list-item>
                                                    <f:list-item text="土家族" value="土家族"></f:list-item>
                                                    <f:list-item text="彝族" value="彝族"></f:list-item>
                                                    <f:list-item text="蒙古族" value="蒙古族"></f:list-item>
                                                    <f:list-item text="藏族" value="藏族"></f:list-item>
                                                    <f:list-item text="布依族" value="布依族"></f:list-item>
                                                    <f:list-item text="侗族" value="侗族"></f:list-item>
                                                    <f:list-item text="瑶族" value="瑶族"></f:list-item>
                                                    <f:list-item text="朝鲜族" value="朝鲜族"></f:list-item>
                                                    <f:list-item text="白族" value="白族"></f:list-item>
                                                    <f:list-item text="其他" value="其他"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                        </f:items>
                                    </f:panel>
                                    <f:panel id="Panel4" css-class="f-tablestyle-left-border" box-flex="3" show-border="false" show-header="false"
                                        layout="VBox">
                                        <f:items>
                                            <f:text-box id="tbxArchivesNum" label="档案号" show-red-star="true" required="true" empty-text="不填自动生成"></f:text-box>
                                            <f:drop-down-list id="ddlReasonsFile" label="建档原因" show-red-star="true" required="true">
                                                <f:items>
                                                    <f:list-item text="" value="0" selected="true"></f:list-item>
                                                    <f:list-item text="糖尿病" value="1" selected="true"></f:list-item>
                                                    <f:list-item text="糖尿病高危个体" value="2"></f:list-item>
                                                    <f:list-item text="动脉硬化临床前期" value="3"></f:list-item>
                                                    <f:list-item text="肥胖" value="4"></f:list-item>
                                                    <f:list-item text="高血压" value="5"></f:list-item>
                                                    <f:list-item text="代谢综合征" value="6"></f:list-item>
                                                    <f:list-item text="冠心病" value="7"></f:list-item>
                                                    <f:list-item text="血脂异常" value="8"></f:list-item>
                                                    <f:list-item text="亚健康" value="9"></f:list-item>
                                                    <f:list-item text="脂肪肝" value="10"></f:list-item>
                                                    <f:list-item text="痛风" value="11"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                            <f:text-area id="tbxConfName" label="并发症" box-flex="1"></f:text-area>
                                        </f:items>
                                    </f:panel>
                                    <f:panel id="Panel5" css-class="nolabelpanel" title="面板1" box-flex="2" show-border="false" show-header="false"
                                        layout="VBox">
                                        <f:items>
                                            <f:image id="Image1" image-url="/res/images/blank_180.png" image-height="120" box-flex="1" css-class="userphoto">
                                            </f:image>
                                            <f:file-upload id="FileUpload1" button-text="上传照片" button-only="true" css-class="uploadbutton"></f:file-upload>
                                        </f:items>
                                    </f:panel>
                                </f:items>
                            </f:panel>
                            <f:form id="Form7" show-border="false" show-header="false" message-target="Qtip">
                                <f:items>
                                    <f:form-row>
                                        <f:items>
                                            <f:text-box id="tbxPassWord" label="密码" empty-text="默认为手机号码后6位"></f:text-box>
                                            <f:drop-down-list id="ddlLevel" label="会员级别" compare-message="类型不能为空！">
                                                <f:items>
                                                    <f:list-item text="普通会员" value="0" selected="true"></f:list-item>
                                                    <f:list-item text="银牌会员" value="1"></f:list-item>
                                                    <f:list-item text="金牌会员" value="2"></f:list-item>
                                                    <f:list-item text="钻石会员" value="3"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                        </f:items>
                                    </f:form-row>
                                    <f:form-row>
                                        <f:items>
                                            <f:text-box id="ManageShow" label="健康顾问"></f:text-box>
                                            <f:drop-down-list id="ddlCardType" label="卡类型">
                                                <f:items>
                                                    <f:list-item text="主卡" value="0" selected="true"></f:list-item>
                                                    <f:list-item text="副卡" value="1"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                        </f:items>
                                    </f:form-row>
                                    <f:form-row>
                                        <f:items>
                                            <f:text-box id="tbxOwnCardID" label="会员卡号"></f:text-box>
                                            <f:text-box id="tbxHostCardID" label="主卡号"></f:text-box>
                                        </f:items>
                                    </f:form-row>
                                    <f:form-row>
                                        <f:items>
                                            <f:text-box id="tbxRecommender" label="推荐人卡号"></f:text-box>
                                            <f:text-box id="tbxRecomName" label="推荐人姓名"></f:text-box>
                                        </f:items>
                                    </f:form-row>
                                    <f:form-row>
                                        <f:items>
                                            <f:number-box id="nbxShoukaSum" label="售卡金额" no-decimal="true" min-value="0"></f:number-box>
                                            <f:drop-down-list id="ddlPayType" label="支付方式">
                                                <f:items>
                                                    <f:list-item text="现金支付" value="0" selected="true"></f:list-item>
                                                    <f:list-item text="银行卡支付" value="1"></f:list-item>
                                                    <f:list-item text="支票支付" value="2"></f:list-item>
                                                    <f:list-item text="信用卡支付" value="3"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                        </f:items>
                                    </f:form-row>
                                    <f:form-row>
                                        <f:items>
                                            <f:drop-down-list id="ddlCertificates" label="证件类别">
                                                <f:items>
                                                    <f:list-item text="身份证" value="0" selected="true"></f:list-item>
                                                    <f:list-item text="军官证" value="1"></f:list-item>
                                                    <f:list-item text="护照" value="2"></f:list-item>
                                                    <f:list-item text="驾驶证" value="3"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                            <f:text-box id="tbxIDCardEdit" label="证件号"></f:text-box>
                                        </f:items>
                                    </f:form-row>
                                    <f:form-row column-widths="50% 50%">
                                        <f:items>
                                            <f:text-box id="tbxCustomerEmail" label="邮箱" regex-pattern="EMAIL" regex-message="请输入有效的邮箱地址"></f:text-box>
                                            <f:text-box id="tbxCustomerTel" label="手机号" regex="^[1]+[358]+\d{9}$"></f:text-box>
                                        </f:items>
                                    </f:form-row>
                                    <f:form-row>
                                        <f:items>
                                            <f:drop-down-list id="ddlEducation" label="文化程度">
                                                <f:items>
                                                    <f:list-item text="研究生" value="研究生" selected="true"></f:list-item>
                                                    <f:list-item text="大学本科" value="大学本科"></f:list-item>
                                                    <f:list-item text="大学专科" value="大学专科 "></f:list-item>
                                                    <f:list-item text="中等职业" value="中等职业"></f:list-item>
                                                    <f:list-item text="普通高级中学" value="普通高级中学"></f:list-item>
                                                    <f:list-item text="初级中学" value="初级中学"></f:list-item>
                                                    <f:list-item text="小学" value="小学"></f:list-item>
                                                    <f:list-item text="小学以下" value="小学以下"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                            <f:drop-down-list id="ddlProfession" label="职业">
                                                <f:items>
                                                    <f:list-item text="国家机关、党群组织、企业、事业单位负责人" value="国家机关、党群组织、企业、事业单位负责人" selected="true"></f:list-item>
                                                    <f:list-item text="专业技术人员" value="专业技术人员"></f:list-item>
                                                    <f:list-item text="办事人员和有关人员 " value="办事人员和有关人员 "></f:list-item>
                                                    <f:list-item text="商业、服务业人员" value="商业、服务业人员"></f:list-item>
                                                    <f:list-item text="农、林、牧、渔、水利业生产人员" value="农、林、牧、渔、水利业生产人员"></f:list-item>
                                                    <f:list-item text="生产、运输设备操作人员及有关人员" value="生产、运输设备操作人员及有关人员"></f:list-item>
                                                    <f:list-item text="军人" value="军人"></f:list-item>
                                                    <f:list-item text="不便分类的其他从业人员" value="不便分类的其他从业人员"></f:list-item>
                                                    <f:list-item text="婴幼儿、学龄前儿童" value="婴幼儿、学龄前儿童"></f:list-item>
                                                    <f:list-item text="学生" value="学生"></f:list-item>
                                                    <f:list-item text="家务" value="家务"></f:list-item>
                                                    <f:list-item text="无业或待业" value="无业或待业"></f:list-item>
                                                    <f:list-item text="其他" value="其他"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                        </f:items>
                                    </f:form-row>
                                    <f:form-row>
                                        <f:items>
                                            <f:text-box id="tbxNativePlace" label="籍贯"></f:text-box>
                                            <f:drop-down-list id="ddlUserState" label="会员状态" compare-message="会员状态不能为空！">
                                                <f:items>
                                                    <f:list-item text="启用" value="0" selected="true"></f:list-item>
                                                    <f:list-item text="禁用" value="1"></f:list-item>
                                                </f:items>
                                            </f:drop-down-list>
                                        </f:items>
                                    </f:form-row>
                                </f:items>
                            </f:form>
                        </f:items>
                    </f:form>
                </f:items>
                <f:toolbars>
                    <f:toolbar id="Toolbar1" toolbar-align="Right" position="Bottom">
                        <f:items>
                            <f:button id="btnSubmit" icon-font="_Save" text="保存信息" on-click="btnSubmit_Click" validate-forms="Form1"
                                validate-message-box="false"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:window>

        </th:block>
    </body>

</html>
