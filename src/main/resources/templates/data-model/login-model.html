<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · DataModel 登录</title>
        <!--/* 声明本页引用的其它源文件（分号分隔，每项写成 前缀:值，前缀有 route/template/class/res 四种，见 SourceFiles）：首页"查看源代码"把它们也渲染为选项卡 */-->
        <meta name="sourcefiles" content="class:com.fineui.java.examples.datamodel.model.LoginForm" />
    </head>

    <body>
        <th:block layout:fragment="body">
            <div style="padding:10px">用户名：admin<br />密码：admin888<br /><br />输入框中按回车可提交表单。</div>
            <f:window id="Window1" width="350" window-position="GoldenSection" enable-close="false" is-modal="false" title="登录表单">
                <f:items>
                    <f:simple-form id="SimpleForm1" show-header="false" body-padding="10" remove-last-fields-margin="true" show-border="false">
                        <f:items>
                            <f:text-box for="currentUser.userName"></f:text-box>
                            <f:text-box for="currentUser.password"></f:text-box>
                        </f:items>
                    </f:simple-form>
                </f:items>
                <f:toolbars>
                    <f:toolbar id="Toolbar1" position="Bottom" toolbar-align="Right">
                        <f:items>
                            <f:button id="btnLogin" type="Submit" text="登录" validate-target="Top" validate-forms="SimpleForm1" button-color="Primary"
                                on-click="btnLogin_Click"></f:button>
                            <f:button id="btnReset" type="Reset" text="重置"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:window>
        </th:block>
    </body>

</html>
