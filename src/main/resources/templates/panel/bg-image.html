<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 面板背景图片</title>

        <style th:inline="css">
            .mybgpanel>.f-panel-bodyct>.f-panel-body {
                background-position: right bottom;
                background-repeat: no-repeat;
            }

            .mybgpanel.bg1>.f-panel-bodyct>.f-panel-body {
                background-color: #B1EEEF;
                background-image: url([(@{/res/images/bg/1.jpg})]);
            }

            .mybgpanel.bg2>.f-panel-bodyct>.f-panel-body {
                background-color: #D9CAB5;
                background-image: url([(@{/res/images/bg/2.jpg})]);
            }

            .mybgpanel.bg3>.f-panel-bodyct>.f-panel-body {
                background-color: #FEF3D5;
                background-image: url([(@{/res/images/bg/3.jpg})]);
            }

            .mybgpanel.bg4>.f-panel-bodyct>.f-panel-body {
                background-color: #E4ECA1;
                background-image: url([(@{/res/images/bg/4.jpg})]);
            }

            .mybgpanel.bg5>.f-panel-bodyct>.f-panel-body {
                background-color: #7FC1C0;
                background-image: url([(@{/res/images/bg/5.jpg})]);
            }

            .mybgpanel.bg6>.f-panel-bodyct>.f-panel-body {
                background-color: #9BD1DB;
                background-image: url([(@{/res/images/bg/6.jpg})]);
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="Panel1" css-class="mybgpanel bg1" auto-scroll="true" show-border="false" enable-collapse="false" body-padding="20px" layout="Column"
                show-header="false" is-view-port="true">
                <f:items>
                    <f:panel id="Panel24" column-width="50%" show-border="false" show-header="false" margin-right="5">
                        <f:items>
                            <f:panel id="Panel25" body-padding="10" show-border="true" show-header="false" margin-bottom="5"
                                content="本页面背景图片每 5 秒更换一次！<br><br><br><br><br><br>"></f:panel>
                            <f:panel id="Panel26" body-padding="10" show-border="true" show-header="false" margin-bottom="5"
                                content="我的面板<br><br><br><br><br><br>"></f:panel>
                        </f:items>
                    </f:panel>
                    <f:panel id="Panel28" column-width="50%" show-border="false" show-header="false">
                        <f:items>
                            <f:panel id="Panel29" body-padding="10" show-border="true" show-header="false" margin-bottom="5"
                                content="我的面板<br><br><br><br><br><br>"></f:panel>
                            <f:panel id="Panel30" body-padding="10" show-border="true" show-header="false" margin-bottom="5"
                                content="我的面板<br><br><br><br><br><br>"></f:panel>
                        </f:items>
                    </f:panel>
                </f:items>
            </f:panel>

        </th:block>
        <th:block layout:fragment="script">
            <script>
                F.ready(function() {
                    var panel1El = F.ui.Panel1.el;
                    window.setInterval(function() {
                        var bgClsExec = /\bbg(\d+)\b/ig.exec(panel1El.attr('class'));
                        if (bgClsExec && bgClsExec.length === 2) {
                            var bgNumber = parseInt(bgClsExec[1], 10);
                            panel1El.removeClass('bg' + bgNumber);
                            bgNumber++;
                            if (bgNumber > 6) {
                                bgNumber = 1;
                            }
                            panel1El.addClass('bg' + bgNumber);
                        }
                    }, 5000);
                });

            </script>
        </th:block>
    </body>

</html>
