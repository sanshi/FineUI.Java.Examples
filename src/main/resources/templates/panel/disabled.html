<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 禁用面板</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="Panel1" is-fluid="true" title="面板" enabled="false" body-padding="10" enable-collapse="false" icon-font="_VolumeUp">
                <f:toolbars>
                    <f:toolbar id="Toolbar1" position="Bottom">
                        <f:items>
                            <f:toolbar-text id="ToolbarText1" text="工具条文本一"></f:toolbar-text>
                            <f:toolbar-separator id="ToolbarSeparator1"></f:toolbar-separator>
                            <f:toolbar-text id="ToolbarText2" text="工具条文本二"></f:toolbar-text>
                            <f:toolbar-separator id="ToolbarSeparator2"></f:toolbar-separator>
                            <f:button id="btnToolbarButton" text="工具条按钮"></f:button>
                            <f:toolbar-fill id="ToolbarFill1"></f:toolbar-fill>
                            <f:toolbar-text id="ToolbarText4" text="工具条文本四"></f:toolbar-text>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
                <f:items>
                    <f:panel id="Panel2" title="内容面板" show-border="true" height="200" body-padding="10" enable-collapse="false" show-header="true">
                    </f:panel>
                </f:items>
            </f:panel>
            <br />

            <f:button id="Button2" css-class="marginr" text="启用/禁用面板" on-click="Button2_Click"></f:button>

        </th:block>
        <th:block layout:fragment="script">
            <script>
                function onToolbarButtonClick(event) {
                    F.alert("你点击了工具栏按钮");
                }

            </script>
        </th:block>
    </body>

</html>
