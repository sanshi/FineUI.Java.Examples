<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 动态修改分页（数据库数据）</title>
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:grid id="Grid1" title="动态修改分页（数据库数据）" show-header="true" show-border="true" is-fluid="true" height="400" data-id-field="Id"
                data-text-field="Name" allow-paging="false" is-database-paging="true" is-database-sorting="false" enable-multi-select="false"
                paging-toolbar-visible="true" on-page-index-changed="Grid1_PageIndexChanged" on-page-size-changed="Grid1_PageSizeChanged">
                <f:columns>
                    <f:render-field column-id="Name" header-text="姓名" data-field="Name" sort-field="Name" width="220"></f:render-field>
                    <f:render-field column-id="EntranceYear" header-text="入学年份" data-field="EntranceYear" field-type="Int" sort-field="EntranceYear"
                        width="240"></f:render-field>
                </f:columns>
                <f:page-items>
                    <f:button id="BusinessButton" text="业务按钮" on-click="BusinessButton_Click"></f:button>
                </f:page-items>
            </f:grid>
            <br>
            <f:button id="Button1" text="应用配置" on-click="Button1_Click" css-class="marginr"></f:button>
            <f:button id="Button2" text="恢复配置" on-click="Button2_Click" css-class="marginr"></f:button>
            <f:button id="Button3" text="读取当前配置" on-click="Button3_Click" css-class="marginr"></f:button>
            <br><br>
            <f:label id="LabelResult" text="修改后再次回发，核对后台取得的当前配置。"></f:label>

            <p>示例用数据工具模拟数据库查询。开启分页后只读取当前页，并设置总记录数；关闭分页时重新读取全部数据，不能把已加载的一页当成完整数据。</p>
        </th:block>
    </body>

</html>
