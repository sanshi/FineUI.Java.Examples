<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 节点选中（客户端事件）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:tree id="Tree1" is-fluid="true" show-header="true" title="树控件（多选）" enable-multi-select="true">
                <f:nodes>
                    <f:tree-node text="中国" expanded="true" node-id="china">
                        <f:tree-node text="河南省" expanded="true" node-id="henan">
                            <f:tree-node text="驻马店市" expanded="true" node-id="zhumadian">
                                <f:tree-node text="遂平县" node-id="suiping"></f:tree-node>
                                <f:tree-node text="西平县" node-id="xiping"></f:tree-node>
                            </f:tree-node>
                            <f:tree-node text="漯河市" node-id="luohe"></f:tree-node>
                        </f:tree-node>
                        <f:tree-node text="安徽省" expanded="true" node-id="anhui">
                            <f:tree-node text="合肥市" node-id="hefei"></f:tree-node>
                            <f:tree-node text="黄山市" node-id="huangshan"></f:tree-node>
                        </f:tree-node>
                    </f:tree-node>
                </f:nodes>
                <f:listeners>
                    <f:listener event="nodeselect" handler="onTree1NodeSelect"></f:listener>
                    <f:listener event="nodedeselect" handler="onTree1NodeDeselect"></f:listener>
                    <f:listener event="selectionchange" handler="onTree1SelectionChange"></f:listener>
                </f:listeners>
            </f:tree>
            <br />

            <f:label id="labResult" encode-text="false"></f:label>
            <br />
            <br />
            事件列表（<a href="javascript:$('#result').html('');">clear</a>）：
            <ul id="result"></ul>

        </th:block>

        <th:block layout:fragment="script">
            <script>
                function onTree1NodeSelect(event, nodeId) {
                    var date = new Date();
                    $('#result').append(F.formatString('<li>[{0}:{1}] nodeselect：{2}</li>',
                        date.getMinutes(),
                        date.getSeconds(),
                        nodeId));
                }

                function onTree1NodeDeselect(event, nodeId) {
                    var date = new Date();
                    $('#result').append(F.formatString('<li>[{0}:{1}] nodedeselect：{2}</li>',
                        date.getMinutes(),
                        date.getSeconds(),
                        nodeId));
                }

                function onTree1SelectionChange(event) {
                    var date = new Date();
                    $('#result').append(F.formatString('<li>[{0}:{1}] selectionchange</li>',
                        date.getMinutes(),
                        date.getSeconds()));
                }

            </script>
        </th:block>
    </body>

</html>
