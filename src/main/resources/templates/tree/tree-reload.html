<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 重新加载节点</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:tree id="Tree1" is-fluid="true" enable-collapse="false" show-header="true" title="树控件" auto-leaf-identification="false">
                <f:nodes>
                    <f:tree-node text="中国" expanded="true">
                        <f:tree-node text="河南省" expanded="true">
                            <f:tree-node text="驻马店市" node-id="zhumadian" leaf="true"></f:tree-node>
                            <f:tree-node text="漯河" node-id="luohe" leaf="true"></f:tree-node>
                        </f:tree-node>
                        <f:tree-node text="安徽省" expanded="true" node-id="anhui">
                            <f:tree-node text="合肥市" node-id="hefei">
                                <f:tree-node text="金色池塘小区" node-id="golden" leaf="true"></f:tree-node>
                                <f:tree-node text="中国科学技术大学" node-id="ustc" leaf="true"></f:tree-node>
                            </f:tree-node>
                        </f:tree-node>
                    </f:tree-node>
                </f:nodes>
            </f:tree>
            <br />

            <f:hidden-field id="hfDataSource" text="source1"></f:hidden-field>
            <f:button id="btnGetSelectedNode" on-click="btnGetSelectedNode_Click" css-class="marginr" text="获取选中的节点"></f:button>
            <f:button id="btnUpdateNode" on-click="btnUpdateNode_Click" css-class="marginr" text="更新节点[驻马店市]"></f:button>
            <br />

            <f:label id="labResult" encode-text="false"></f:label>

        </th:block>
    </body>

</html>
