<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 节点点击（右键菜单也触发）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:tree id="Tree1" is-fluid="true" show-header="true" title="树控件">
                <f:nodes>
                    <f:tree-node text="中国" expanded="true" node-id="china">
                        <f:tree-node text="河南省" expanded="true" node-id="henan">
                            <f:tree-node text="驻马店市（点击回发）" expanded="true" node-id="zhumadian">
                                <f:tree-node text="遂平县（点击回发）" node-id="suiping"></f:tree-node>
                                <f:tree-node text="西平县（点击回发，确认提示框）" node-id="xiping"></f:tree-node>
                            </f:tree-node>
                            <f:tree-node text="漯河市" node-id="luohe"></f:tree-node>
                        </f:tree-node>
                        <f:tree-node text="安徽省" expanded="true" node-id="anhui">
                            <f:tree-node text="合肥市" node-id="hefei"></f:tree-node>
                            <f:tree-node text="黄山市" node-id="huangshan"></f:tree-node>
                        </f:tree-node>
                    </f:tree-node>
                </f:nodes>
                <f:listeners>
                    <f:listener event="nodeclick" handler="onTree1NodeClick"></f:listener>
                </f:listeners>
            </f:tree>
            <br />

            <f:label id="labResult" encode-text="false"></f:label>
            <br />
            <br />
            注：在树节点上点击右键菜单时，会触发 nodeclick 事件。

        </th:block>

        <th:block layout:fragment="script">
            <script>
                F.ready(function() {

                    // 点击右键菜单时，触发 nodeclick 事件
                    F.ui.Tree1.on('beforenodecontextmenu', function(event, nodeId) {
                        this.trigger('nodeclick', [event, nodeId]);
                    });

                });

                function onTree1NodeClick(event, nodeId) {
                    var tree = this;

                    // 节点为西平县时，先弹出确认提示框
                    if (nodeId === 'xiping') {
                        if (!confirm('确定回发？')) {
                            return;
                        }
                    }

                    if ($.inArray(nodeId, ["zhumadian", "suiping", "xiping"]) >= 0) {
                        var nodeData = tree.getNodeData(nodeId);

                        // 触发后台事件
                        F.customEvent('Tree1_NodeClick', nodeId);
                    }
                }

            </script>
        </th:block>
    </body>

</html>
