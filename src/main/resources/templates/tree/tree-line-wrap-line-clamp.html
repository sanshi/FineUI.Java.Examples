<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 节点文字换行（多行省略）</title>

        <style>
            .nodetitle {
                font-weight: bold;
            }

            /* 最多显示 2 行文字，超出则显示省略号 */
            .f-tree-node .f-tree-cell-text {
                white-space: normal;
                word-break: break-all;
                overflow: hidden;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                display: -webkit-box;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:tree id="Tree1" is-fluid="true" show-header="true" title="树控件" enable-collapse="false" width="350">
                <f:nodes>
                    <f:tree-node text="中国" expanded="true" node-id="china">
                        <f:tree-node text="河南省" expanded="true" node-id="henan">
                            <f:tree-node
                                text-raw-html="<span class='nodetitle'>驻马店市</span>，位于河南省南部，地处淮河流域，历史悠久，文化底蕴深厚。因古时设驿站而得名，素有“豫州之腹地、天下之最中”之称。农业发达，是全国重要的粮食生产基地，被誉为“中原粮仓”。"
                                node-id="zhumadian">
                                <f:tree-node text="遂平县" leaf="false" node-id="suiping">
                                    <f:tree-node text="槐树乡" leaf="false" node-id="huaishu">
                                        <f:tree-node text="陈庄村" node-id="chenzhuang"></f:tree-node>
                                    </f:tree-node>
                                </f:tree-node>
                            </f:tree-node>
                            <f:tree-node text="漯河市" node-id="luohe"></f:tree-node>
                        </f:tree-node>
                        <f:tree-node text="安徽省" expanded="true" node-id="anhui">
                            <f:tree-node text="合肥市" expanded="true" node-id="hefei">
                                <f:tree-node text="金色池塘小区" node-id="golden"></f:tree-node>
                                <f:tree-node text="中国科学技术大学" node-id="ustc"></f:tree-node>
                            </f:tree-node>
                        </f:tree-node>
                    </f:tree-node>
                </f:nodes>
            </f:tree>

        </th:block>
    </body>

</html>
