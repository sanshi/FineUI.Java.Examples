<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 表格与表单（弹出窗体，表单中保存）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" enable-collapse="false" title="表格与表单"
                data-id-field="Id" data-key-names="Id,Name" allow-cell-editing="true" clicks-to-edit="2" on-row-command="Grid1_RowCommand">
                <f:toolbars>
                    <f:toolbar position="Top">
                        <f:items>
                            <f:button id="btnNew" text="新增" icon="Add" click-handler="onNewButtonClick"></f:button>
                            <f:button id="btnEdit" text="编辑" icon="Pencil" click-handler="onEditButtonClick"></f:button>
                            <f:button id="btnDelete" text="删除" icon="Delete" click-handler="onDeleteButtonClick"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
                <f:columns>
                    <!--/* 可编辑的列必须各自声明 <f:editor>：列带不带编辑器就决定了它能不能进入单元格编辑，没有编辑器的列一律只读 */-->
                    <f:row-number-field width="60"></f:row-number-field>
                    <f:render-field header-text="姓名" column-id="Name" data-field="Name">
                        <f:editor>
                            <f:text-box id="tbxEditorName"></f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="性别" column-id="Gender" data-field="Gender" field-type="Int" renderer-function="renderGender"
                        hidden="true">
                        <f:editor>
                            <f:drop-down-list id="ddlEditorGender">
                                <f:list-item text="男" value="1"></f:list-item>
                                <f:list-item text="女" value="0"></f:list-item>
                            </f:drop-down-list>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="入学年份" column-id="EntranceYear" data-field="EntranceYear" field-type="Int">
                        <f:editor>
                            <f:number-box id="nbxEditorEntranceYear" no-decimal="true" no-negative="true" min-value="2000" max-value="2025"></f:number-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field header-text="入学日期" column-id="EntranceDate" data-field="EntranceDate" field-type="Date" renderer="Date"
                        renderer-argument="yyyy/MM/dd" width="150" hidden="true">
                        <f:editor>
                            <f:date-picker id="dpEditorEntranceDate"></f:date-picker>
                        </f:editor>
                    </f:render-field>
                    <f:render-check-field header-text="是否在校" column-id="AtSchool" data-field="AtSchool"
                        enable-column-edit="false"></f:render-check-field>
                    <f:render-field header-text="所学专业" column-id="Major" data-field="Major" expand-unused-space="true" min-width="150">
                        <f:editor>
                            <f:text-box id="tbxEditorMajor"></f:text-box>
                        </f:editor>
                    </f:render-field>
                    <f:render-field column-id="Edit" width="50" text-align="Center" enable-header-menu="false">
                        <f:commands>
                            <f:command command-name="Edit" icon="Pencil" tool-tip="编辑"></f:command>
                        </f:commands>
                    </f:render-field>
                    <f:render-field column-id="Delete" width="50" text-align="Center" enable-header-menu="false">
                        <f:commands>
                            <f:command command-name="Delete" icon="Delete" tool-tip="删除" confirm-text="删除选中行？" confirm-target="Top"></f:command>
                        </f:commands>
                    </f:render-field>
                </f:columns>
                <f:listeners>
                    <f:listener event="rowcommand" handler="onGrid1RowCommand"></f:listener>
                </f:listeners>
            </f:grid>

            <br />
            <br />
            <f:window id="Window1" title="弹出窗体" hidden="true" enable-iframe="false" enable-maximize="true" target="Self" enable-resize="true"
                is-modal="true" width="600">
                <f:items>
                    <f:simple-form id="SimpleForm1" show-border="false" show-header="false" body-padding="10">
                        <f:items>
                            <f:hidden-field id="hfFormID"></f:hidden-field>
                            <f:text-box id="tbxFormUserName" label="姓名" show-red-star="true" required="true"></f:text-box>
                            <f:radio-button-list id="rblFormGender" label="性别" show-red-star="true" required="true">
                                <f:radio-item text="男" value="1"></f:radio-item>
                                <f:radio-item text="女" value="0"></f:radio-item>
                            </f:radio-button-list>
                            <f:number-box id="nbFormEntranceYear" label="入学年份" no-decimal="true" no-negative="true" min-value="2000"
                                max-value="2025" show-red-star="true" required="true"></f:number-box>
                            <f:date-picker id="dpFormEntranceDate" label="入学日期" show-red-star="true" required="true" enable-edit="false"></f:date-picker>
                            <f:check-box id="cbFormAtSchool" label="是否在校"></f:check-box>
                            <f:drop-down-list id="ddlFormMajor" label="所学专业" show-red-star="true" required="true" auto-select-first-item="false">
                                <f:list-item text="材料科学与工程系" value="材料科学与工程系"></f:list-item>
                                <f:list-item text="化学系" value="化学系"></f:list-item>
                                <f:list-item text="数学系" value="数学系"></f:list-item>
                                <f:list-item text="物理系" value="物理系"></f:list-item>
                                <f:list-item text="自动化系" value="自动化系"></f:list-item>
                                <f:list-item text="计算机科学与工程系" value="计算机科学与工程系"></f:list-item>
                            </f:drop-down-list>
                        </f:items>
                        <f:toolbars>
                            <f:toolbar position="Bottom" toolbar-align="Right">
                                <f:items>
                                    <f:button id="btnSave" icon="SystemSave" text="保存数据" validate-forms="SimpleForm1" on-click="btnSave_Click"></f:button>
                                </f:items>
                            </f:toolbar>
                        </f:toolbars>
                    </f:simple-form>
                </f:items>
            </f:window>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script>
                // 点击「新增」：重置表单，弹出窗体
                function onNewButtonClick(event) {
                    // 重置表单字段（隐藏字段里的行标识也一并清空，保存时按新增处理）
                    F.ui.SimpleForm1.reset();

                    F.ui.Window1.setTitle('新增数据');
                    F.ui.Window1.show();
                }

                // 点击「编辑」：按当前选中行打开编辑窗体
                function onEditButtonClick(event) {
                    showEditWindow();
                }

                // 行命令：编辑走客户端并阻止后台事件，删除没有返回值、继续走后台事件
                function onGrid1RowCommand(event, rowId, rowIndex, columnId, commandName) {
                    if (commandName === 'Edit') {
                        showEditWindow(rowId);
                        return false;
                    }
                }

                // 点击「删除」：选中行标识只有浏览器知道，确认后随自定义回发送到服务端
                // （确认框是异步的，没法在这个函数里等用户点完，所以先返回 false，点确定后由 ok 回调发起回发）
                function onDeleteButtonClick(event) {
                    var grid1 = F.ui.Grid1;
                    if (!grid1.hasSelection()) {
                        F.alert('请至少选择一项！');
                        return false;
                    }

                    var selectedRows = grid1.getSelectedRows();
                    F.confirm({
                        message: F.rawHtml('你确定要删除选中的&nbsp;<b>' + selectedRows.length + '</b>&nbsp;行数据吗？'),
                        messageIcon: 'warning',
                        ok: function() {
                            F.customEvent('Grid1_DeleteRows', {
                                selectedRows: selectedRows
                            });
                        }
                    });
                    return false;
                }

                // 打开编辑窗体：不传行标识就取当前选中行，再把该行数据填进表单
                function showEditWindow(rowId) {
                    var grid1 = F.ui.Grid1;

                    if (!rowId) {
                        var selectedRowIds = grid1.getSelectedRows();
                        if (!selectedRowIds.length) {
                            F.alert('请至少选择一项！');
                            return;
                        }
                        rowId = selectedRowIds[0];
                    }

                    F.ui.Window1.setTitle('编辑数据');

                    // 当前行数据
                    var rowValue = grid1.getRowValue(rowId);

                    // 用当前行数据填充表单字段
                    F.ui.hfFormID.setValue(rowId);
                    F.ui.tbxFormUserName.setValue(rowValue['Name']);
                    F.ui.rblFormGender.setValue(rowValue['Gender']);
                    F.ui.nbFormEntranceYear.setValue(rowValue['EntranceYear']);
                    F.ui.dpFormEntranceDate.setValue(rowValue['EntranceDate']);
                    F.ui.cbFormAtSchool.setValue(rowValue['AtSchool']);
                    F.ui.ddlFormMajor.setValue(rowValue['Major']);

                    F.ui.Window1.show();
                }

            </script>
        </th:block>
    </body>

</html>
