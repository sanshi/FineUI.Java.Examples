<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 复选框列（选中行全选）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                    <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int"></f:render-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true"
                        min-width="150"></f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                    <f:render-check-field header-text="是否在校2" column-id="AtSchool2" data-field="AtSchool" render-as-static-field="false"></f:render-check-field>
                    <f:render-check-field header-text="是否在校3" column-id="AtSchool3" data-field="AtSchool" render-as-static-field="false"></f:render-check-field>
                    <f:render-check-field header-text="是否在校4" column-id="AtSchool4" data-field="AtSchool" render-as-static-field="false"></f:render-check-field>
                </f:columns>
                <f:toolbars>
                    <f:toolbar id="Toolbar1">
                        <f:items>
                            <f:button id="btnSelectRows" text="全选选中行" click-handler="onSelectRows"></f:button>
                            <f:button id="btnUnselectRows" text="取消选中行" click-handler="onUnselectRows"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:grid>
            <br />
            <br />
            <f:button text="选中行复选框的状态" click-handler="onNotifyCheckFieldStatusClick"></f:button>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                function onSelectRows(event) {
                    var grid1 = F.ui.Grid1;
                    var selectedRows = grid1.getSelectedRowEls();
                    if (selectedRows.length) {
                        // 同步选中行的三个独立复选框列。
                        selectedRows.each(function() {
                            // 多列更新通过对象传入各列的新值，列名使用 ColumnID。
                            // https://fineui.com/js/api/FineUI.Grid.html#updateCellValue
                            grid1.updateCellValue($(this), {
                                AtSchool2: true,
                                AtSchool3: true,
                                AtSchool4: true
                            }, true);
                        });
                    } else {
                        F.alert("请至少选择一项！");
                    }
                }

                function onUnselectRows(event) {
                    var grid1 = F.ui.Grid1;
                    var selectedRows = grid1.getSelectedRowEls();
                    if (selectedRows.length) {
                        // 同步选中行的三个独立复选框列。
                        selectedRows.each(function() {
                            grid1.updateCellValue($(this), {
                                AtSchool2: false,
                                AtSchool3: false,
                                AtSchool4: false
                            }, true);
                        });
                    } else {
                        F.alert("请至少选择一项！");
                    }
                }

                function onNotifyCheckFieldStatusClick(event) {
                    var grid1 = F.ui.Grid1;

                    var rowEls = grid1.getSelectedRowEls();
                    if (!rowEls.length) {
                        F.alert('没有选中项！');
                        return;
                    }

                    var result = ['<table class="result">'];
                    result.push('<tr>');
                    result.push('<th>ID</th>');
                    result.push('<th>姓名</th>');
                    result.push('<th>是否在校2</th>');
                    result.push('<th>是否在校3</th>');
                    result.push('<th>是否在校4</th>');
                    result.push('</tr>');
                    rowEls.each(function() {
                        var cnode = $(this);
                        var rowData = grid1.getRowData(cnode);
                        var isChecked2 = rowData.values['AtSchool2'];
                        var isChecked3 = rowData.values['AtSchool3'];
                        var isChecked4 = rowData.values['AtSchool4'];

                        result.push('<tr>');
                        result.push('<td>' + rowData.id + '</td>');
                        result.push('<td>' + rowData.text + '</td>');
                        result.push('<td>' + (isChecked2 ? '在校' : '不在校') + '</td>');
                        result.push('<td>' + (isChecked3 ? '在校' : '不在校') + '</td>');
                        result.push('<td>' + (isChecked4 ? '在校' : '不在校') + '</td>');
                        result.push('</tr>');
                    });
                    result.push('</table>');

                    F.notify({
                        message: F.rawHtml(result.join('')),
                        target: '_top',
                        header: false,
                        messageIcon: '',
                        positionX: 'center',
                        positionY: 'top'
                    });
                }

            </script>
        </th:block>
    </body>

</html>
