<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 导出文件（多表头）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:group-field header-text="分组一" text-align="Center">
                        <f:columns>
                            <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                            <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                            <f:group-field header-text="考试成绩" text-align="Center">
                                <f:columns>
                                    <f:render-field header-text="语文成绩" data-field="ChineseScore" text-align="Center"></f:render-field>
                                    <f:render-field header-text="数学成绩" data-field="MathScore" text-align="Center"></f:render-field>
                                    <f:render-field header-text="总成绩" data-field="TotalScore" text-align="Center"></f:render-field>
                                </f:columns>
                            </f:group-field>
                        </f:columns>
                    </f:group-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true"
                        min-width="150"></f:render-field>
                    <f:render-field header-text="注册日期" data-field="LogTime" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd"></f:render-field>
                </f:columns>
            </f:grid>
            <br /><br />
            <f:button text="导出为Excel文件" click-handler="onButton1Click"></f:button>

            <!-- 隐藏表单，用于自定义 POST 请求 -->
            <form id="myform" th:action="@{/grid/excel-group-field/export}" method="post">
                <input type="hidden" id="content" name="content" />
            </form>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script>
                function getResolvedColumns(columns) {
                    var result = [];
                    for (var i = 0, count = columns.length; i < count; i++) {
                        var column = columns[i];

                        var columnResult = {
                            text: column.text
                        };

                        if (column.columns) {
                            columnResult.columns = getResolvedColumns(column.columns);
                        }

                        result.push(columnResult);
                    }
                    return result;
                }

                function getColumns() {
                    return getResolvedColumns(F.ui.Grid1.columns);
                }

                function onButton1Click(event) {
                    // 自定义 POST 请求
                    document.getElementById('content').value = F.toJSON(getColumns());
                    // CSRF：把运行时令牌复制进隐藏表单后再提交（Spring Security 校验 _csrf 参数）
                    var $myform = $('#myform');
                    var $csrfInput = $('#FineUICsrfToken');
                    if ($csrfInput.length && !$myform.find('input[name="' + $csrfInput.attr('name') + '"]').length) {
                        $('<input type="hidden">').attr('name', $csrfInput.attr('name')).val($csrfInput.val()).appendTo($myform);
                    }
                    $myform[0].submit();
                }

            </script>
        </th:block>
    </body>

</html>
