<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 导出文件（选择需要导出的列）</title>
        <!--/* 声明本页引用的其它源文件（分号分隔，每项写成 前缀:值，前缀有 route/template/class/res 四种，见 SourceFiles）：首页"查看源代码"把它们也渲染为选项卡 */-->
        <meta name="sourcefiles" content="route:grid/excel-select-columns-iframe" />
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格" data-id-field="Id" data-text-field="Name">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                    <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int"></f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true"
                        min-width="150"></f:render-field>
                    <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup"></f:render-field>
                    <f:render-field header-text="注册日期" data-field="LogTime" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd"></f:render-field>
                </f:columns>
            </f:grid>
            <br /><br />
            <f:button text="选择需要导出的列" click-handler="onOpenWindow1Click"></f:button>

            <f:window id="Window1" title="选择需要导出的列" hidden="true" enable-iframe="true" iframe-url="/grid/excel-select-columns-iframe" enable-maximize="true"
                target="Top" enable-resize="true" is-modal="true" width="450" height="250">
            </f:window>

            <!-- 隐藏表单，用于自定义 POST 请求 -->
            <form id="myform" th:action="@{/grid/excel-select-columns/export}" method="post">
                <input type="hidden" id="columns" name="columns" />
            </form>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                function exportToExcel(columns) {
                    // 自定义 POST 请求
                    document.getElementById('columns').value = F.toJSON(columns);
                    // CSRF：把运行时令牌复制进隐藏表单后再提交（Spring Security 校验 _csrf 参数）
                    var $myform = $('#myform');
                    var $csrfInput = $('#FineUICsrfToken');
                    if ($csrfInput.length && !$myform.find('input[name="' + $csrfInput.attr('name') + '"]').length) {
                        $('<input type="hidden">').attr('name', $csrfInput.attr('name')).val($csrfInput.val()).appendTo($myform);
                    }
                    $myform[0].submit();
                }

                function onOpenWindow1Click(event) {
                    F.ui.Window1.show();
                }

            </script>
        </th:block>
    </body>

</html>
