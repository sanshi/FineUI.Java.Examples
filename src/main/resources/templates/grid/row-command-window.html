<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 行命令弹窗</title>
        <meta name="sourcefiles" content="route:grid/row-command-window-details" />
    </head>

    <body>
        <th:block layout:fragment="body">
            <p>点击“查看客户”，使用该行的客户标识打开详情，并把客户姓名显示在窗体标题中。</p>
            <!-- Slug 和 DisplayName 只供命令使用，无需增加隐藏列或 data-attribute-fields。 -->
            <f:grid id="Grid1" title="客户列表" show-header="true" show-border="true" is-fluid="true" data-id-field="ID">
                <f:columns>
                    <f:render-field header-text="客户编号" data-field="ID" width="150"></f:render-field>
                    <f:render-field header-text="操作" expand-unused-space="true">
                        <f:commands>
                            <f:command text="查看客户" command-name="View" window-id="Details"
                                window-iframe-url-format-string="/grid/row-command-window-details?slug={0}" window-iframe-url-fields="Slug"
                                window-title-format-string="客户 - {0}" window-title-fields="DisplayName"></f:command>
                        </f:commands>
                    </f:render-field>
                </f:columns>
            </f:grid>
            <f:window id="Details" title="客户详情" width="500" height="300" is-modal="true" enable-iframe="true" hidden="true"></f:window>
        </th:block>
    </body>

</html>
