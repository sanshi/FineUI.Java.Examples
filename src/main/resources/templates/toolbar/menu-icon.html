<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 菜单项图标</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel is-fluid="true" show-border="true" body-padding="10" height="300" title="面板" enable-collapse="false">
                <f:toolbars>
                    <f:toolbar>
                        <f:items>
                            <f:toolbar-text text="内联菜单"></f:toolbar-text>
                            <f:toolbar-separator></f:toolbar-separator>
                            <f:button text="中国科学技术大学">
                                <f:menu>
                                    <f:menu-hyper-link id="MenuHyperLink1" target="_blank" navigate-url="http://scms.ustc.edu.cn/" text="化学与材料科学学院"
                                        icon="Accept"></f:menu-hyper-link>
                                    <f:menu-hyper-link id="MenuHyperLink2" target="_blank" navigate-url="http://business.ustc.edu.cn/zh_CN/" text="管理学院"
                                        icon="Accept">
                                        <f:menu>
                                            <f:menu-hyper-link id="MenuHyperLink3" target="_blank" navigate-url="http://is.ustc.edu.cn/"
                                                text="工商管理系"></f:menu-hyper-link>
                                            <f:menu-hyper-link id="MenuHyperLink4" target="_blank" navigate-url="http://stat.ustc.edu.cn/"
                                                text="统计与金融系"></f:menu-hyper-link>
                                        </f:menu>
                                    </f:menu-hyper-link>
                                </f:menu>
                            </f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
                <f:items>
                    <f:button id="Button1" text="删除[化学与材料科学学院]菜单项的图标" css-class="marginr" on-click="Button1_Click"></f:button>
                    <f:button id="Button2" text="修改[管理学院]菜单项的图标" on-click="Button2_Click"></f:button>
                </f:items>
            </f:panel>

        </th:block>
    </body>

</html>
