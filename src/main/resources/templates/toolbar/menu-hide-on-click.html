<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 菜单点击隐藏</title>

        <style>
            .my-menutext,
            .my-menutext .f-menu-item-text {
                cursor: default;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel is-fluid="true" show-border="true" body-padding="10" height="300" title="面板" enable-collapse="false">
                <f:toolbars>
                    <f:toolbar>
                        <f:items>
                            <f:toolbar-text text="内联菜单"></f:toolbar-text>
                            <f:toolbar-separator></f:toolbar-separator>
                            <f:button text="中国科学技术大学">
                                <f:menu>
                                    <f:menu-hyper-link id="MenuHyperLink1" target="_blank" navigate-url="http://scms.ustc.edu.cn/"
                                        text="化学与材料科学学院"></f:menu-hyper-link>
                                    <f:menu-text id="MenuText1" css-class="my-menutext" text="管理学院" hide-on-click="false">
                                        <f:menu>
                                            <f:menu-hyper-link id="MenuHyperLink3" target="_blank" navigate-url="http://is.ustc.edu.cn/"
                                                text="工商管理系"></f:menu-hyper-link>
                                            <f:menu-hyper-link id="MenuHyperLink4" target="_blank" navigate-url="http://stat.ustc.edu.cn/"
                                                text="统计与金融系"></f:menu-hyper-link>
                                        </f:menu>
                                    </f:menu-text>
                                    <f:menu-text id="MenuText2" css-class="my-menutext" text="物理学院" hide-on-click="true">
                                        <f:menu>
                                            <f:menu-hyper-link target="_blank" navigate-url="http://phys.ustc.edu.cn/" text="物理系"></f:menu-hyper-link>
                                            <f:menu-hyper-link target="_blank" navigate-url="http://astro.ustc.edu.cn/" text="天文学系"></f:menu-hyper-link>
                                        </f:menu>
                                    </f:menu-text>
                                </f:menu>
                            </f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:panel>

            <br>
            <br>
            注：
            <ul>
                <li>菜单项[管理学院]设置了HideOnClick=false，所以点击不会隐藏整个菜单；</li>
                <li>菜单项[物理学院]设置了HideOnClick=true，所以点击会隐藏整个菜单；</li>
            </ul>

        </th:block>
    </body>

</html>
