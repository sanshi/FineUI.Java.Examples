<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 工具栏徽标按钮</title>

        <style>
            .f-toolbar .f-panel-body>.f-btn {
                margin: 5px 0;
            }

            .f-toolbar.toolbar2 .f-panel-body>.f-btn {
                margin: 10px 20px 10px 0;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="Panel1" is-fluid="true" height="500" show-border="true" body-padding="10" title="面板" enable-collapse="false"
                content='<p><a href="http://tech.163.com/special/jobsdead/" target="_blank"><b>乔布斯</b></a></p><p>乔布斯于1955年2月24日出生，苹果创始人之一。今年8月苹果超越埃克森美孚成为全球最大市值企业，截止上季度持有现金达到762亿美金，甚至超过了美国政府国库存款。</p><p>遗憾的是，苹果的取得巨大成功还是无法给乔布斯一个健康的身体，乔布斯2003年被发现患有胰脏癌，随后又查出肝癌，危在旦夕的乔布斯在经历了8年的抗癌斗争、3次病休、若干次手术后，于2011年8月25日正式宣布从CEO位置辞职。2011年10月6日，乔布斯在苹果发布iPhone 4S后的第二天与世长辞。</p>'>
                <f:toolbars>
                    <f:toolbar>
                        <f:items>
                            <f:button id="Button1" text="按钮一" badge="true"></f:button>
                            <f:button id="Button2" text="按钮二" badge="true" badge-type="Error"></f:button>
                            <f:button id="Button3" text="按钮三" badge="true" badge-type="Success" badge-animation-type="Fade"></f:button>
                        </f:items>
                    </f:toolbar>
                    <f:toolbar css-class="toolbar2">
                        <f:items>
                            <f:button id="Button4" text="按钮四" badge="true" badge-text="10" badge-type="Success"></f:button>
                            <f:button id="Button5" text="按钮五" badge="true" badge-text="new"></f:button>
                            <f:button id="Button6" text="按钮六" badge="true" badge-text="999+" badge-type="Success" badge-animation-type="Processing"></f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
            </f:panel>

        </th:block>
    </body>

</html>
