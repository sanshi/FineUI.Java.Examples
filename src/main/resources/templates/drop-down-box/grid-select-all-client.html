<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 下拉表格（客户端全选）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" enable-collapse="false" show-border="true" title="下拉表格（多选）" show-header="true">
                <f:items>
                    <f:drop-down-box id="DropDownBox1" empty-text="请从下拉表格中选择" match-field-width="false" enable-multi-select="true" data-control-id="Grid1">
                        <f:pop-panel>
                            <f:panel id="Panel7" body-padding="10px" width="650" height="300" hidden="true" show-border="true" show-header="false" layout="Fit">
                                <f:toolbars>
                                    <f:toolbar position="Bottom">
                                        <f:items>
                                            <f:button id="btnSelectAll" text="全选" click-handler="onSelectAllClick"></f:button>
                                            <f:button id="btnSelectHuaxue" text="全选化学系" click-handler="onSelectHuaxueClick"></f:button>
                                            <f:button id="btnSelectWuli" text="全选物理系" click-handler="onSelectWuliClick"></f:button>
                                            <f:button id="btnSelectCailiao" text="全选材料系（保持已选中项）" click-handler="onSelectSelectCailiaoClick"></f:button>
                                        </f:items>
                                    </f:toolbar>
                                </f:toolbars>
                                <f:items>
                                    <f:grid id="Grid1" show-border="true" show-header="false" data-id-field="Id" data-text-field="Name"
                                        enable-check-box-select="true" enable-multi-select="true" keep-current-selection="true">
                                        <f:columns>
                                            <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                                            <f:render-field header-text="性别" data-field="Gender" field-type="Int"
                                                renderer-function="renderGender"></f:render-field>
                                            <f:render-field header-text="所学专业" data-field="Major" expand-unused-space="true" min-width="150"></f:render-field>
                                        </f:columns>
                                    </f:grid>
                                </f:items>
                            </f:panel>
                        </f:pop-panel>
                    </f:drop-down-box>
                    <f:button id="btnGetSelection" text="获取下拉框的选中值" css-class="marginr" on-click="btnGetSelection_Click"></f:button>
                </f:items>
            </f:simple-form>
            <br>

            <f:label id="labResult" encode-text="false"></f:label>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script th:inline="none">
                function getRowIdsByMajor(majorName) {
                    var grid = F.ui.Grid1,
                        rows = [];
                    $.each(grid.data, function(index, rowData) {
                        if (rowData.values['Major'] == majorName) {
                            rows.push(rowData.id);
                        }
                    });
                    return rows;
                }

                function onSelectAllClick(event) {
                    F.ui.Grid1.selectAllRows();
                    // 将数据控件中的值同步到输入框
                    F.ui.DropDownBox1.syncToBox();
                }

                function onSelectHuaxueClick(event) {
                    F.ui.Grid1.selectRows(getRowIdsByMajor('化学系'));
                    // 将数据控件中的值同步到输入框
                    F.ui.DropDownBox1.syncToBox();
                }

                function onSelectWuliClick(event) {
                    F.ui.Grid1.selectRows(getRowIdsByMajor('物理系'));
                    // 将数据控件中的值同步到输入框
                    F.ui.DropDownBox1.syncToBox();
                }

                function onSelectSelectCailiaoClick(event) {
                    F.ui.Grid1.selectRows(getRowIdsByMajor('材料科学与工程系'), {
                        keep: true
                    });
                    // 将数据控件中的值同步到输入框
                    F.ui.DropDownBox1.syncToBox();
                }

            </script>
        </th:block>
    </body>

</html>
