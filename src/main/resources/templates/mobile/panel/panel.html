<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · Panel</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:panel id="Panel1" show-header="false" show-border="false" layout="Fit" body-padding="10px" is-view-port="true">
                <f:toolbars>
                    <f:toolbar title="面板标题" header-style="true"></f:toolbar>
                    <f:toolbar id="Toolbar1" position="Bottom" css-class="f-state-default">
                        <f:items>
                            <f:button id="Button1" text="按钮一" size="Small" enable-default-state="false" click-handler="onButton1Click"></f:button>
                            <f:toolbar-fill></f:toolbar-fill>
                            <f:button text="菜单按钮" size="Small" enable-default-state="false" show-menu-icon="false">
                                <f:menu>
                                    <f:menu-button text="菜单一" click-handler="onMyMenuButtonClick"></f:menu-button>
                                    <f:menu-button text="菜单二" click-handler="onMyMenuButtonClick"></f:menu-button>
                                    <f:menu-button text="菜单三" click-handler="onMyMenuButtonClick"></f:menu-button>
                                    <f:menu-button text="菜单四" click-handler="onMyMenuButtonClick"></f:menu-button>
                                </f:menu>
                            </f:button>
                        </f:items>
                    </f:toolbar>
                </f:toolbars>
                <f:items>
                    <f:content-panel id="ContentPanel2" show-border="false" show-header="false">
                        <p>
                            <a href="http://baike.baidu.com/view/3645.htm" target="_blank"><b>比尔·盖茨</b></a>
                        </p>
                        <p>
                            比尔·盖茨（Bill
                            Gates），全名威廉·亨利·盖茨三世，简称比尔或盖茨。1955年10月28日出生于美国华盛顿州西雅图，13岁开始计算机编程设计，18岁考入哈佛大学，一年后从哈佛退学，1975年与好友保罗·艾伦一起创办了微软公司，比尔盖茨担任微软公司董事长、CEO和首席软件设计师。
                        </p>
                        <p>
                            比尔·盖茨1995-2007年连续13年成为《福布斯》全球富翁榜首富，连续20年成为《福布斯》美国富翁榜首富。
                        </p>
                    </f:content-panel>
                </f:items>
            </f:panel>

        </th:block>

        <th:block layout:fragment="script">
            <script>
                function onButton1Click(event) {
                    F.alert('您点击了按钮一');
                }

                function onMyMenuButtonClick(event) {
                    F.alert({
                        message: '您点击了菜单项：' + this.getText(),
                        header: false,
                        buttonPlain: true
                    });
                }

            </script>
        </th:block>
    </body>

</html>
