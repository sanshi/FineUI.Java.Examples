<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · AccordionTools</title>

        <style>
            .f-tool.mybadge {
                opacity: 1.0;
                filter: alpha(opacity=100);
            }

            .f-tool.mybadge .f-tool-text {
                padding: 0 4px;
                color: #fff;
                text-align: center;
                white-space: nowrap;
                background-color: #d15b47;
                font-size: 14px;
                border-radius: 12px;
                min-width: 24px;
            }

            .f-tool.mybadge-sub {
                opacity: 0.7;
                filter: alpha(opacity=70);
            }

            .f-tool.mybadge-sub .f-tool-text {
                font-size: 14px;
            }

        </style>
    </head>

    <body>

        <th:block layout:fragment="body">

            <f:accordion id="Accordion1" show-header="false" show-border="false" active-pane-index="1" show-collapse-tool="false" is-view-port="true">
                <f:toolbars>
                    <f:toolbar id="Toolbar1" title="手风琴控件" header-style="true"></f:toolbar>
                </f:toolbars>
                <f:panes>
                    <f:accordion-pane id="AccordionPane1" title="面板一" icon-url="/res/images/16/1.png" body-padding="2px 5px">
                        <f:items>
                            <f:label id="Label1" text="面板一中的文本"></f:label>
                        </f:items>
                        <f:tools>
                            <f:tool css-class="mybadge" text="30"></f:tool>
                        </f:tools>
                    </f:accordion-pane>
                    <f:accordion-pane id="AccordionPane2" title="面板二（列表）" icon-url="/res/images/16/4.png" layout="Fit">
                        <f:items>
                            <f:data-list id="DataList1">
                                <f:data-list-item text="列表项1" />
                                <f:data-list-item text="列表项2" />
                                <f:data-list-item text="列表项3" />
                                <f:data-list-item text="列表项4" />
                                <f:data-list-item text="列表项5" />
                            </f:data-list>
                        </f:items>
                        <f:tools>
                            <f:tool id="Tool1" css-class="mybadge" text="30/260"></f:tool>
                        </f:tools>
                    </f:accordion-pane>
                    <f:accordion-pane id="AccordionPane3" title="面板三（IFrame）" icon-url="/res/images/16/7.png" enable-iframe="true"
                        iframe-url="/mobile/button/button">
                        <f:tools>
                            <f:tool id="Tool3" css-class="mybadge-sub" text="简单的文字描述"></f:tool>
                            <f:tool id="Tool2" css-class="mybadge" text="30/150"></f:tool>
                        </f:tools>
                    </f:accordion-pane>
                </f:panes>
            </f:accordion>

        </th:block>
    </body>

</html>
