<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 多语言表单验证（数据注解）</title>
        <!--/* 声明本页引用的其它源文件（分号分隔，每项写成 前缀:值，前缀有 route/template/class/res 四种，见 SourceFiles）：首页"查看源代码"把它们也渲染为选项卡 */-->
        <meta name="sourcefiles" content="class:com.fineui.java.examples.multilang.model.UICompareModel" />
    </head>

    <body>
        <th:block layout:fragment="body">
            <f:simple-form id="SimpleForm1" is-fluid="true" body-padding="10" label-width="200" show-border="true" show-header="true"
                title="#{multilang.uiCompareAnnotation.title}">
                <f:items>
                    <!-- 数据注解版：标签/校验规则/消息均由 DTO 注解 + 多语言资源推导（for 绑定） -->
                    <f:date-picker for="theModel.startDate"></f:date-picker>
                    <f:date-picker for="theModel.endDate"></f:date-picker>
                    <f:label></f:label>
                    <f:text-box for="theModel.password"></f:text-box>
                    <f:text-box for="theModel.confirmPassword"></f:text-box>
                    <f:label></f:label>
                    <f:number-box for="theModel.number1"></f:number-box>
                    <f:number-box for="theModel.number2"></f:number-box>
                    <f:label></f:label>
                    <f:button id="btnSubmit" text="#{multilang.uiCompareAnnotation.submit}" css-class="marginr" validate-forms="SimpleForm1"
                        on-click="btnSubmit_Click"></f:button>
                    <f:button id="btnReset" text="#{multilang.uiCompareAnnotation.reset}" click-handler="onResetClick"></f:button>
                </f:items>
            </f:simple-form>
        </th:block>
        <th:block layout:fragment="script">
            <script>
                function onResetClick(event) {
                    F.ui.SimpleForm1.reset();
                }

            </script>
        </th:block>
    </body>

</html>
