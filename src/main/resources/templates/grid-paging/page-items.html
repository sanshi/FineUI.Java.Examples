<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 分页工具栏（重新绑定数据）</title>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="表格（内存分页）" height="350" data-id-field="Id" data-text-field="Name"
                enable-check-box-select="true" allow-paging="true" page-size="5" show-paging-message="false">
                <f:columns>
                    <f:row-number-field></f:row-number-field>
                    <f:render-field header-text="姓名" data-field="Name"></f:render-field>
                    <f:render-field header-text="性别" data-field="Gender" field-type="Int" renderer-function="renderGender"></f:render-field>
                    <f:render-field header-text="入学年份" data-field="EntranceYear" field-type="Int"></f:render-field>
                    <f:render-check-field header-text="是否在校" data-field="AtSchool" render-as-static-field="true"></f:render-check-field>
                    <f:render-field header-text="所学专业" data-field="Major" renderer-function="renderMajor" expand-unused-space="true"
                        min-width="150"></f:render-field>
                    <f:render-field header-text="分组" data-field="Group" renderer-function="renderGroup"></f:render-field>
                    <f:render-field header-text="注册日期" data-field="LogTime" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd"></f:render-field>
                </f:columns>
                <f:page-items>
                    <f:button id="btnClearData" text="清空数据" on-click="btnClearData_Click"></f:button>
                    <f:button id="btnRebind" text="重新绑定数据" icon="Reload" on-click="btnRebindData_Click"></f:button>
                    <f:toolbar-separator></f:toolbar-separator>
                    <f:button id="btnSelectAll" text="选中所有行" on-click="btnSelectAll_Click"></f:button>
                    <f:button id="btnClearSelect" text="清空选中行" on-click="btnClearSelect_Click"></f:button>
                </f:page-items>
            </f:grid>
            <br />
            <f:button text="选中了哪些行" click-handler="onNotifySelectedRowsClick"></f:button>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
        </th:block>
    </body>

</html>
