<!DOCTYPE html>
<html xmlns:f="http://fineui.com/java" layout:decorate="~{shared/layout}">

    <head>
        <title>FineUI.Java · 树表格（分页 + 合计行 + 列锁定）</title>

        <style>
            .f-grid-row-summary .f-grid-cell-text {
                font-weight: bold;
                color: red;
            }

        </style>
    </head>

    <body>
        <th:block layout:fragment="body">

            <f:grid id="Grid1" is-fluid="true" show-border="true" show-header="true" title="树表格" data-id-field="Id" data-text-field="Name"
                data-parent-id-field="ParentId" enable-tree="true" tree-column="Name" height="400" allow-paging="true" is-database-paging="true" page-size="2"
                on-page-index-changed="Grid1_PageIndexChanged" enable-summary="true" summary-position="Bottom" allow-column-locking="true"
                enable-check-box-select="true">
                <f:columns>
                    <f:row-number-field enable-tree-number="true"></f:row-number-field>
                    <f:render-field column-id="Name" header-text="姓名" data-field="Name" expand-unused-space="true" min-width="150"
                        enable-lock="true"></f:render-field>
                    <f:render-field header-text="类型" data-field="Type" width="150" enable-lock="true"></f:render-field>
                    <f:render-field header-text="大小" data-field="Size" width="150" enable-lock="true"></f:render-field>
                    <f:render-field header-text="修改日期" data-field="ModifyDate" field-type="Date" renderer="Date" renderer-argument="yyyy/MM/dd" width="150"
                        enable-lock="true"></f:render-field>
                </f:columns>
                <f:page-items>
                    <f:button id="btnExpandAll" text="展开全部" click-handler="onExpandAllClick"></f:button>
                    <f:button id="btnCollapseAll" text="折叠全部" click-handler="onCollapseAllClick"></f:button>
                </f:page-items>
            </f:grid>
            <br />
            <f:button text="选中了哪些行" click-handler="onNotifySelectedRowsClick"></f:button>

        </th:block>
        <th:block layout:fragment="script">
            <script th:src="@{/res/js/grid.js}"></script>
            <script>
                function onExpandAllClick(event) {
                    F.ui.Grid1.expandRows();
                }

                function onCollapseAllClick(event) {
                    F.ui.Grid1.collapseRows();
                }

            </script>
        </th:block>
    </body>

</html>
