server.port=8080

# 首页路由：GET / 重定向到 /index（对应 @FineUIPage("index") 的框架页首页）
fineui.home=index

# Spring Security CSRF：示例站默认采用无服务器状态的 Cookie 令牌仓库；改为 session 可演示有状态方案。
fineui.security-csrf=true
fineui.security-csrf-repository=cookie

# FineUI 全局配置（fineui.* → 全站默认；单用户可由 AppPageManagerInitializer 读 cookie 覆盖）。
# 键名 = JS 配置键的 kebab-case（表单配置项键名带 form- 前缀）；值为与默认不同者才会随首屏下发（增量）。
# 以下 Grid 显隐项与框架默认值一致，显式声明便于按需调整（不产生增量下发）。

# 全局主题（切换 themes/{theme}/theme.css），默认 default
fineui.theme=pure_black
# 是否启用动画效果（选项卡、窗口等），默认 false
fineui.enable-animation=true
# 是否使用自定义美化滚动条，默认 false
fineui.custom-scrollbar=true
# 必填红星相对标签文本的位置（beforeText / afterText），默认 afterText
fineui.form-red-star-position=beforeText
# 表单字段标签的水平对齐（left / right / top），默认 left
fineui.form-label-align=right
# 表单字段标签宽度（像素），默认 100
fineui.form-label-width=100
# 表单字段标签与内容的分隔符，默认 ：
fineui.form-label-separator=\uFF1A
# 表单校验错误提示的显示方式（side / qtip / title / none），默认 side
fineui.form-message-target=side
# 数字的小数点分隔符，默认 .
fineui.form-dot-separator=.
# 数字的千分位分隔符，默认 ,
fineui.form-comma-separator=,
# 表格列头筛选图标是否可见，默认 true
fineui.grid-header-filter-icon-visible=true
# 表格列头排序图标是否可见，默认 true
fineui.grid-header-sort-icon-visible=true
# 表格分页工具栏是否可见，默认 true
fineui.grid-paging-toolbar-visible=true
# 表格分页按钮是否右对齐，默认 true
fineui.grid-pager-align-right=true
# 表格是否显示"已选中 N 行"消息，默认 true
fineui.grid-show-selection-message=true
# 表格分页工具栏样式（arrowNumberBox / arrow / number），默认 arrowNumberBox
fineui.grid-paging-type=arrow
# 表格数据绑定时是否把长整型（long / BigInteger）转成字符串下发（服务端配置，不下发客户端），默认 true
# 关掉后长整型以 JSON 数字下发，超过 2^53-1 的值会在浏览器被舍入（见 grid-other/long-precision 示例）
fineui.grid-convert-long-to-string=true
# 选项卡切换动画类型（slideX / fade），默认 slideX
fineui.tab-strip-animation-type=fade

# 是否启用移动浏览器自适应：head 输出禁止缩放的 viewport meta，默认 false
fineui.mobile-adaption=true

# ===== 内容安全策略 CSP（fineui.csp-*）：全局默认；页面级可在 Page_Get 里 getPageManager().cspScripts(...) 覆盖 =====
# 示例站的普通 FineUI 页面默认使用同源脚本 + 每请求 nonce；第三方编辑器页由专用场景基类关闭。
fineui.csp-scripts=true
fineui.csp-allow-self=true
fineui.csp-allow-nonce=true
# script-src 额外放行的主机白名单（逗号分隔，如 cdn.jsdelivr.net,unpkg.com），默认空
#fineui.csp-allow-urls=
# 示例站不允许任意内联脚本，也不允许字符串代码执行。
fineui.csp-allow-unsafe-inline=false
fineui.csp-allow-unsafe-eval=false

# 开发期关闭模板缓存，改模板即时生效
spring.thymeleaf.cache=false

# 多语言资源（MessageSource）：默认语言=英文值；服务端文本按 Cookie Language 解析出的 Locale 取
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# 文件上传大小上限须覆盖 WebUploader 的最大单文件限制，避免请求在进入处理器前被容器拒绝
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# 日志
logging.level.com.fineui.java=INFO

logging.charset.file=UTF-8
logging.charset.console=UTF-8
